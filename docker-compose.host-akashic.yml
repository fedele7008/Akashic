# ───────────────────────────────────────────────────────────────────────
# docker-compose.host-akashic.yml — overrides for hybrid host-run mode
# ───────────────────────────────────────────────────────────────────────
#
# Use this override when you want to:
#   - Iterate on the akashic server via `go run` on the host (fast
#     rebuild loop, debugger attach, profiler, etc.)
#   - Keep dependencies (postgres, redis, ldap, vault, …) AND the
#     admin-bff + proxy in docker so you don't have to babysit them.
#
# The plain compose file binds the proxy + admin-bff to talk to
# `akashic` / `auth.akashic.local` / `ctrl.akashic.local` resolved as
# docker-network aliases. Those aliases only exist when the akashic
# container is up. In hybrid mode the akashic process lives on the
# host instead, so we override DNS for those names — pointing them at
# `host-gateway`, the special Docker value that routes back to the
# docker host.
#
# How to use:
#
#   # 1. Start dependencies (no --profile app yet)
#   docker compose up -d
#
#   # 2. Start admin-bff in hybrid mode WITHOUT starting akashic. The
#   #    --no-deps flag is critical — without it docker would try to
#   #    start the akashic container too, conflicting with your
#   #    host-run instance.
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.host-akashic.yml \
#     --profile app up -d --no-deps admin-bff
#
#   # 3. Restart the proxy with the override so its auth.* server
#   #    block can reach the host instead of the (non-existent) akashic
#   #    container.
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.host-akashic.yml \
#     up -d --force-recreate proxy
#
#   # 4. Run akashic on the host. Bind control to 0.0.0.0 so the BFF
#   #    container can reach it via host-gateway (the default 127.0.0.1
#   #    bind is unreachable from inside docker).
#   AKASHIC_SERVER_CONTROL_HOST=0.0.0.0 go run ./cmd/akashic run --verbose
#
# Caveat: `AKASHIC_SERVER_CONTROL_HOST=0.0.0.0` exposes the control
# plane on every interface of your dev machine. The mTLS requirement
# still gates access (you need the akashic-cli or admin-bff client
# cert to even reach a handler), but you should still firewall this
# port off from any non-trusted network. For production deployments,
# always use `--profile app` (containerized akashic, loopback-only).
#
# To return to fully-containerized mode:
#
#   docker compose --profile app down
#   docker compose --profile app up -d         # everything in docker

services:
  # The proxy's auth.* server block proxies to https://akashic:8080.
  # In hybrid mode the akashic container isn't running, so docker DNS
  # can't resolve `akashic` and nginx returns 502 on every auth.*
  # request. Mapping `akashic` (and the FQDN aliases the proxy uses
  # via Host headers) to host-gateway routes the call to the host.
  proxy:
    extra_hosts:
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "ctrl.akashic.local:host-gateway"
    volumes:
      # Bind-mount a hybrid-mode-specific nginx config OVER the one
      # baked into the proxy image. The hybrid variant uses static
      # `proxy_pass` for the auth.* server block so DNS resolution
      # happens at config-load via libc (which honors /etc/hosts) —
      # the extra_hosts entries above land in /etc/hosts but NOT in
      # the runtime resolver (127.0.0.11) used by the original
      # nginx.conf's variable-based proxy_pass. See
      # services/proxy/nginx.host-akashic.conf for the full rationale.
      - ./services/proxy/nginx.host-akashic.conf:/etc/nginx/conf.d/default.conf:ro

  # admin-bff dials the auth-server (https://auth.akashic.local:8080)
  # for /token and /jwks, and the control plane (https://ctrl.akashic.local:8081)
  # for management API mTLS calls. Both names need to resolve to the
  # docker host in hybrid mode — extra_hosts populates /etc/hosts so
  # those DNS lookups inside the container resolve to the host.
  #
  # We no longer need a depends_on override here: the main compose
  # file's admin-bff entry doesn't depend on akashic any more (the
  # BFF lazy-initializes its OAuth client on first login, retrying
  # until the akashic-admin secret appears on disk).
  admin-bff:
    extra_hosts:
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "ctrl.akashic.local:host-gateway"
