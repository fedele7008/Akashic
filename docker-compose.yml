services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-bootstrap: TLS Certificate Generator (STEP 1/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Generates self-signed Root CA (RSA 4096-bit) and Vault server certificate
  # (RSA 2048-bit) for HTTPS. Output: ./certs/vault/
  #
  # IMPORTANT: vault-root-ca (here) ≠ akashic-root-ca (created later by Vault)
  # - vault-root-ca: For Vault's TLS connection only
  # - akashic-root-ca: For Akashic's PKI system
  #
  # SANs: vault, localhost, 127.0.0.1
  # Idempotent: Skips if certificates exist
  # Troubleshooting: docker compose logs vault-bootstrap
  vault-bootstrap:
    build: ./services/vault/bootstrap
    container_name: akashic-vault-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/vault-bootstrap.sh"]
    volumes:
      - vault_file:/file
      - certs:/certs
      - ./services/vault/bootstrap:/bootstrap
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault: HashiCorp Vault Server (STEP 2/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Secrets management backend. Starts SEALED, initialized by vault-init.
  #
  # Storage: File-based (vault_file volume) - NOT HA-ready
  # Endpoints:
  #   - API: https://localhost:8200 (bound to 127.0.0.1 only)
  #   - UI: https://localhost:8200/ui (login with decrypted root token)
  #   - Cluster: https://localhost:8201
  #
  # Security: IPC_LOCK (no swap), TLS required, localhost-only
  # Access Vault CLI: docker exec -it akashic-vault bash
  # Troubleshooting: docker compose logs vault
  vault:
    build: ./services/vault
    container_name: akashic-vault
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://localhost:8200"
      VAULT_API_ADDR: "https://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
      VAULT_CAPATH: "/vault/certs/vault/root-ca.crt"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Don't expose vault to public
      - "127.0.0.1:${AKASHIC_VAULT_HOST_PORT:-8200}:8200"
      - "127.0.0.1:${AKASHIC_VAULT_CLUSTER_PORT:-8201}:8201"
    volumes:
      - vault_file:/vault/file
      - vault_logs:/vault/logs
      - certs:/vault/certs
      - ./services/vault/config.hcl:/vault/config/vault.hcl:ro
    command: server
    cap_add:
      - IPC_LOCK
    networks:
      default:
        aliases:
          - vault.akashic.local
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/vault/certs/vault/root-ca.crt", "https://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-init: Vault Initialization & PKI Engine Setup (STEP 3/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Three-step process:
  #   1. Initialize Vault (Shamir 5/3, AES-256-GCM encrypted keys)
  #   2. Unseal Vault (SAT-based intelligent key discovery)
  #   3. Mount PKI engines (pki-root, pki-internal, pki-public, pki-mtls-*)
  #
  # Output: ./.secrets/vault/ (root-token.enc + keys/vault-key-*.enc)
  # Engine configs: ./services/vault/init/configs/*.json
  #
  # CRITICAL REQUIREMENTS:
  #   1. AKASHIC_SECRET must be set in .env (32+ chars, never commit)
  #   2. BACKUP ./.secrets/vault/ immediately (loss = permanent vault lockout)
  #   3. Loss of AKASHIC_SECRET = cannot decrypt tokens = no vault access
  #
  # Decrypt tokens (run from host after compiling akashic-cli):
  #   akashic-cli pki token inspect -i ./.secrets/vault/root-token.enc
  #
  # Idempotent: Skips already-initialized/unsealed/mounted steps
  # Manual control: Comment out this service, run akashic-cli commands manually
  # Troubleshooting: docker compose logs vault-init
  vault-init:
    build:
      context: .
      dockerfile: ./services/vault/init/Dockerfile
    container_name: akashic-vault-init
    restart: "no"
    environment:
      AKASHIC_SECRET: "${AKASHIC_SECRET:-}"
      # use docker container's vault address using docker dns
      AKASHIC_VAULT_ADDRESS: "https://vault:8200"
      AKASHIC_VAULT_TLS_CACERT: "/certs/vault/root-ca.crt"
      CERTS_OUTPUT_DIR: "/certs"
      CONFIGS_DIR: "/configs"
      AKASHIC_PKI_CRL_BASE_URL: "${AKASHIC_PKI_CRL_BASE_URL:-http://localhost:8280}"
      VAULT_TOKEN_FILE: "/vault/token/vault/root-token.enc"
      VAULT_KEY_DIR: "/vault/token/vault/keys"
      VAULT_AGENT_OUTPUT_DIR: "/vault/token/vault-agent"
      VAULT_ADMIN_USERNAME: "${AKASHIC_VAULT_USERNAME:-}"
      VAULT_ADMIN_PASSWORD: "${AKASHIC_VAULT_PASSWORD:-}"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - secrets:/vault/token
      - certs:/certs
      - ./services/vault/init/scripts:/scripts:ro
      - ./services/vault/init/configs:/configs:ro
    entrypoint: ["/bin/bash"]
    command: ["/scripts/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-agent: Certificate Lifecycle Manager
  # ═══════════════════════════════════════════════════════════════════════════════
  # Issues and auto-renews leaf certificates via Vault's PKI engines.
  # Authenticates with AppRole (role-id + secret-id from vault-init Step 14).
  #
  # Each template uses a single pkiCert call with writeToFile to produce
  # separate .crt, .key, and ca.pem files. Certs are renewed at ~2/3 TTL.
  #
  # Templates: ./services/vault-agent/templates/*.tpl
  # Manages: postgres, redis, ldap, loki-proxy, akashic-ctrl, akashic-auth,
  #          akashic-mtls-ctrl, akashic-cli-client, bff-client
  # Troubleshooting: docker compose logs vault-agent
  vault-agent:
    build: ./services/vault-agent
    container_name: akashic-vault-agent
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - certs:/certs
      - secrets:/vault-agent/auth:ro
      # Upstream hashicorp/vault image declares VOLUME /vault/file and
      # /vault/logs for Vault-as-server mode. Vault Agent doesn't write to
      # them, but Docker materializes an anonymous volume per declaration
      # unless we claim them explicitly. Name them so they show up in
      # `docker volume ls` instead of appearing as 64-char hashes.
      - vault_agent_file:/vault/file
      - vault_agent_logs:/vault/logs
    networks:
      default:
        aliases:
          - vault-agent.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # proxy: Akashic Reverse Proxy (nginx)
  # ═══════════════════════════════════════════════════════════════════════════════
  # General-purpose nginx reverse proxy for the Akashic project.
  # Each port maps to a different service:
  #
  # Port 8280 — PKI: CRL/CA Distribution (Vault)
  #   GET /v1/{engine}/crl      → Certificate Revocation List (DER)
  #   GET /v1/{engine}/crl/pem  → Certificate Revocation List (PEM)
  #   GET /v1/{engine}/ca       → CA Certificate (DER)
  #   GET /v1/{engine}/ca/pem   → CA Certificate (PEM)
  #   All other paths           → 403 Forbidden
  #
  # Add new server blocks in nginx.conf and expose ports here as services grow.
  proxy:
    build: ./services/proxy
    container_name: akashic-proxy
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
      # The auth.* server block uses static `proxy_pass` which loads
      # `proxy_ssl_trusted_certificate /certs/akashic/auth-ca.crt`
      # at config-load. Without vault-agent that file doesn't exist.
      vault-agent:
        condition: service_started
    environment:
      ADMINER_AUTH_USER: ${AKASHIC_ADMINER_AUTH_USER:-}
      ADMINER_AUTH_PASSWORD: ${AKASHIC_ADMINER_AUTH_PASSWORD:-}
      REDISINSIGHT_AUTH_USER: ${AKASHIC_REDISINSIGHT_AUTH_USER:-}
      REDISINSIGHT_AUTH_PASSWORD: ${AKASHIC_REDISINSIGHT_AUTH_PASSWORD:-}
      PHPLDAPADMIN_AUTH_USER: ${AKASHIC_PHPLDAPADMIN_AUTH_USER:-}
      PHPLDAPADMIN_AUTH_PASSWORD: ${AKASHIC_PHPLDAPADMIN_AUTH_PASSWORD:-}
    ports:
      - "${AKASHIC_NGINX_PORT:-8280}:8280"
    volumes:
      - certs:/certs:ro
    # Unconditional host-gateway aliases for akashic. Whether akashic
    # runs in docker (`--profile app`) or on the host (`go run`), the
    # name `akashic` (and its FQDN aliases) resolves to the host
    # gateway here. Container mode: docker port-forwarding bridges
    # host:8080 → akashic-container:8080 transparently. Host mode:
    # the host akashic process listens on 0.0.0.0:8080 directly.
    # The same nginx config works in both cases.
    extra_hosts:
      - "host.docker.internal:host-gateway"  # explicit for Linux compat
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "ctrl.akashic.local:host-gateway"
      - "api.akashic.local:host-gateway"
    networks:
      default:
        aliases:
          - proxy.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # postgres: PostgreSQL Database (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent, fixes ownership (uid 70),
  # and starts PostgreSQL with SSL enabled.
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS: ssl=on, requires client to verify server cert (sslmode=verify-ca)
  # Troubleshooting: docker compose logs postgres
  postgres:
    build: ./services/postgres
    container_name: akashic-postgres
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    environment:
      POSTGRES_TLS: "${AKASHIC_POSTGRES_TLS:-on}"
      POSTGRES_USER: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AKASHIC_DATABASE_POSTGRES_DB}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - postgres.akashic.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ═══════════════════════════════════════════════════════════════════════════════
  # redis: Redis Cache/Session Store (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent, fixes ownership (uid 999),
  # and starts Redis with TLS on the main port (plain port disabled).
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS hot-reload: cert-watcher uses CONFIG SET (no restart needed)
  # Troubleshooting: docker compose logs redis
  redis:
    build: ./services/redis
    container_name: akashic-redis
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    command: >-
      --appendonly yes
      --save 900 1 --save 300 10 --save 60 10000
      --requirepass ${AKASHIC_DATABASE_REDIS_PASSWORD}
    environment:
      REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
      REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - redis.akashic.local
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ═══════════════════════════════════════════════════════════════════════════════
  # loki: Grafana Loki backend (plain HTTP, internal only)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Stock grafana/loki image, plain HTTP on 3100. Not exposed to the host.
  # TLS termination is handled by the loki-proxy service in front of this.
  #
  # Network alias: loki-runtime.akashic.local (the proxy owns loki.akashic.local)
  # Troubleshooting: docker compose logs loki
  loki:
    image: grafana/loki:3.5.5
    container_name: akashic-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - loki_data:/loki
      - ./services/loki/config.yml:/etc/loki/config.yml:ro
    networks:
      default:
        aliases:
          - loki-runtime.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # loki-proxy: TLS-termination proxy for Loki (internal + 127.0.0.1 host)
  # ═══════════════════════════════════════════════════════════════════════════════
  # nginx that sits in front of Loki. Listens on 3100 -- with TLS when
  # AKASHIC_LOKI_PROXY_TLS=on (default), plain HTTP when off. Forwards to
  # loki-runtime.akashic.local:3100 (plain) in both cases.
  #
  # Accessible from:
  #  - Docker containers in akashic-net: {https,http}://loki.akashic.local:3100
  #  - Host machine (bound to 127.0.0.1): {https,http}://localhost:3100
  #
  # Bound to 127.0.0.1 on the host, so it's NOT publicly reachable -- only
  # processes on the same machine (e.g. the Akashic Go server running on
  # the host) can reach the Loki API via this proxy.
  #
  # Certificates (TLS mode only): issued by vault-agent via pki-internal/server
  # TLS rotation: cert-watcher runs `nginx -s reload` on cert change
  # Troubleshooting: docker compose logs loki-proxy
  loki-proxy:
    build: ./services/loki-proxy
    container_name: akashic-loki-proxy
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      loki:
        condition: service_started
    environment:
      LOKI_TLS_MODE: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Bind to 127.0.0.1 only -- never publicly exposed
      - "127.0.0.1:${AKASHIC_LOKI_PROXY_HOST_PORT:-3100}:3100"
    volumes:
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - loki.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # grafana: Grafana dashboard
  # ═══════════════════════════════════════════════════════════════════════════════
  # Entrypoint generates /etc/grafana/provisioning/datasources/loki.yml at
  # startup, pointing to https://loki.akashic.local:3100 (the loki-proxy).
  #
  # Accessible via proxy at grafana.<domain>. Has own admin login, so no
  # proxy-level basic auth.
  grafana:
    build: ./services/grafana
    container_name: akashic-grafana
    restart: unless-stopped
    depends_on:
      loki-proxy:
        condition: service_started
    environment:
      LOKI_TLS_MODE: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      GF_SECURITY_ADMIN_USER: ${AKASHIC_GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${AKASHIC_GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      # When running behind a reverse proxy, tell Grafana to trust the
      # X-Forwarded-Proto/Host headers so links and redirects use the
      # external HTTPS URL instead of the internal HTTP URL.
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_PROXY_ENABLED: "false"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - grafana_data:/var/lib/grafana
      - certs:/certs-source:ro
    ports:
      - 127.0.0.1:${AKASHIC_GF_HOST_PORT:-3000}:3000/tcp
      
  adminer:
    image: adminer
    container_name: akashic-adminer
    restart: always
    ports:
      - 127.0.0.1:25000:8080/tcp

  redisinsight:
    build: ./services/redisinsight
    container_name: akashic-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_ENCRYPTION_KEY: "${AKASHIC_SECRET}"
      RI_ENCRYPTION_KEYTAR: "false"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      RI_REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
    ports:
      - 127.0.0.1:25001:5540/tcp
    volumes:
      - redisinsight_data:/data
      - certs:/certs:ro

  # ═══════════════════════════════════════════════════════════════════════════════
  # ldap: OpenLDAP Directory Server (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent to the writable path
  # osixia/openldap expects (/container/service/slapd/assets/certs/). Works
  # around osixia's aggressive chown behavior on cert files.
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS hot-reload: cert-watcher triggers slapd re-read via ldapmodify
  # Troubleshooting: docker compose logs ldap
  ldap:
    build: ./services/ldap
    container_name: akashic-ldap
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    environment:
      LDAP_TLS_MODE: "${AKASHIC_LDAP_TLS:-on}"
      LDAP_ORGANISATION: ${AKASHIC_LDAP_ORGANISATION:-Akashic}
      LDAP_DOMAIN: ${AKASHIC_LDAP_DOMAIN:-akashic.local}
      LDAP_ADMIN_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${AKASHIC_LDAP_CONFIG_PASSWORD}
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_LDAP_HOST_PORT:-389}:389"
      - "${AKASHIC_LDAP_LDAPS_HOST_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - ldap.akashic.local
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════════
  # phpldapadmin: Web UI for OpenLDAP
  # ═══════════════════════════════════════════════════════════════════════════════
  # Connects to LDAP via LDAPS when TLS is on. The CA cert is mounted so
  # phpldapadmin can verify the LDAP server certificate.
  #
  # Accessible via proxy at phpldapadmin.<domain> (basic auth + rate limit).
  phpldapadmin:
    build: ./services/phpldapadmin
    container_name: akashic-phpldapadmin
    restart: unless-stopped
    depends_on:
      ldap:
        condition: service_healthy
    environment:
      LDAP_TLS_MODE: "${AKASHIC_LDAP_TLS:-on}"
      PHPLDAPADMIN_HTTPS: "false"
      PHPLDAPADMIN_TRUST_PROXY_SSL: "true"
      # Configure LDAP host with StartTLS on port 389 when TLS mode is on.
      # osixia processes #PYTHON2BASH: only for direct Docker env vars (not yaml files).
      # When LDAP_TLS_MODE=off, the entrypoint overwrites this with a plain hostname.
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'ldap.akashic.local': [{'server': [{'tls': True}, {'port': 389}]}, {'login': [{'bind_id': 'cn=admin,dc=akashic,dc=local'}]}]}]"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - 127.0.0.1:${AKASHIC_PHPLDAPADMIN_HOST_PORT:-25002}:80/tcp
    volumes:
      - certs:/certs-source:ro
      # osixia/phpldapadmin declares VOLUME /var/www/phpldapadmin for its
      # web-app root. Name it so the generated config.php + FIRST_START_DONE
      # marker live in a recognizable volume instead of a 64-char hash.
      # Note: the entrypoint intentionally deletes config.php on each start
      # to force regeneration against the current TLS mode, so the volume
      # is not used for persistence -- it exists only because the upstream
      # image insists on it.
      - phpldapadmin_www:/var/www/phpldapadmin

  # ═══════════════════════════════════════════════════════════════════════════════
  # akashic: Akashic IDP Server (Phase 4)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Container-mode run of the Akashic Go server. Host-mode (`go run ./cmd/akashic
  # run`) remains the default dev flow; enable this service via the `app` profile
  # when you want the full-stack containerized:
  #
  #     docker compose --profile app up -d
  #
  # (All dependency services — postgres, redis, ldap, loki, grafana, etc. — run
  # by default with no profile; only `app` is opt-in.)
  #
  # The server reads TLS on/off per-dependency from .env (AKASHIC_POSTGRES_TLS,
  # AKASHIC_REDIS_TLS, AKASHIC_LDAP_TLS, AKASHIC_LOKI_PROXY_TLS). Certs come
  # from the shared `certs` volume, written by vault-agent in-place, and
  # hot-reloaded by the in-process watcher (AKASHIC_PKI_CERT_WATCHER_ENABLED).
  #
  # Troubleshooting: docker compose logs akashic
  akashic:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ./services/akashic/Dockerfile
    container_name: akashic-server
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # LDAP is a hard dependency: Akashic refuses to start if LDAP is
      # unreachable (see CLAUDE.md on "LDAP as single source of truth").
      # Without this, `docker compose --profile app up -d akashic` starts
      # just postgres/redis/vault-agent and akashic crashes on LDAP dial.
      ldap:
        condition: service_healthy
      # loki-proxy is a soft dependency: logs would just fail to ship if
      # the proxy is missing. We still declare it so the full observability
      # pipeline comes up alongside akashic rather than needing a second
      # `docker compose up -d` to light up Grafana.
      loki-proxy:
        condition: service_started
    environment:
      # Dependency hosts resolve via docker-network aliases inside the container.
      AKASHIC_DATABASE_POSTGRES_HOST: postgres.akashic.local
      AKASHIC_DATABASE_REDIS_HOST: redis.akashic.local
      AKASHIC_LDAP_HOST: ldap.akashic.local
      AKASHIC_LOKI_PROXY_HOST: loki.akashic.local
      # In host-run mode the control server binds to 127.0.0.1 (only reachable
      # via host loopback). In container-run, Docker's port-forwarding maps
      # host loopback (127.0.0.1:8081) to the container's eth0 interface, so
      # the server inside the container must listen on 0.0.0.0 to receive
      # those forwarded packets. The host-side loopback-only security boundary
      # is preserved by the compose `ports:` binding (127.0.0.1:8081:8081)
      # rather than by the application's listener interface.
      AKASHIC_SERVER_CONTROL_HOST: 0.0.0.0
      # TLS toggles come from .env; re-declared here so `docker compose config`
      # resolves them at the expected point.
      AKASHIC_POSTGRES_TLS: "${AKASHIC_POSTGRES_TLS:-on}"
      AKASHIC_REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
      AKASHIC_LDAP_TLS: "${AKASHIC_LDAP_TLS:-on}"
      AKASHIC_LOKI_PROXY_TLS: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      # Credentials — note the env-var names map directly to the Go config
      # struct via Viper's AutomaticEnv (prefix=AKASHIC, replacer '.' → '_').
      # ldap.bind_password → AKASHIC_LDAP_BIND_PASSWORD. Host-run picks up
      # AKASHIC_LDAP_ADMIN_PASSWORD via the YAML ${...} expansion; inside
      # the container we additionally set the struct-aligned name so the
      # value reaches the code even if config.yaml isn't read for any reason.
      AKASHIC_DATABASE_POSTGRES_USERNAME: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
      AKASHIC_DATABASE_POSTGRES_PASSWORD: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
      AKASHIC_DATABASE_POSTGRES_DB: ${AKASHIC_DATABASE_POSTGRES_DB}
      AKASHIC_DATABASE_REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      AKASHIC_LDAP_ADMIN_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      AKASHIC_LDAP_BIND_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      AKASHIC_SECRET: ${AKASHIC_SECRET}
      # Phase 7: OAuth issuer + redirect URI for the akashic-admin
      # built-in client. Defaults match the docker-internal alias
      # (auth.akashic.local), which works only when the operator's
      # browser resolves that name (e.g. /etc/hosts → 127.0.0.1).
      # Operators with a real public hostname override these in .env
      # to e.g. https://auth.akashic.example.com — keeping issuer in
      # the akashic-server and admin-bff in lockstep is critical, so
      # both AKASHIC_OAUTH_ISSUER (this var) and AKASHIC_BFF_OAUTH_ISSUER
      # below take the same value.
      AKASHIC_OAUTH_ISSUER: "${AKASHIC_OAUTH_ISSUER:-https://auth.akashic.local}"
      AKASHIC_OAUTH_ADMIN_REDIRECT_URI: "${AKASHIC_OAUTH_ADMIN_REDIRECT_URI:-https://admin.akashic.local/oauth/callback}"
      # Portal callback. Same value the portal container reads — they
      # MUST agree exactly (the akashic-server registers this in
      # client_services; the portal sends it on /authorize). If the
      # two diverge, the auth server returns redirect_uri_mismatch.
      # Toggle the akashic-admin built-in OAuth client (admin-bff
      # console login). Default true. Set false for "minimal mode" —
      # CLI is the only operator surface, no admin web. The
      # akashic-admin row is removed from client_services on next
      # boot when this is false.
      AKASHIC_OAUTH_ADMIN_BFF_ENABLED: "${AKASHIC_OAUTH_ADMIN_BFF_ENABLED:-true}"
      # Phase 8b: deployment-wide CORS allowlist for tenant-product
      # origins that may embed Akashic widgets. Comma- or space-
      # separated. Both the auth-server's /session/token and the
      # api-server's bearer endpoints honour this list. Empty = no
      # widget origins permitted (safe default).
      AKASHIC_PORTAL_TENANT_ORIGINS: "${AKASHIC_PORTAL_TENANT_ORIGINS:-}"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Auth server (8080): public — OAuth/OIDC.
      # Control server (8081): loopback-only — mTLS admin plane.
      # API server (8082): public — bearer-authenticated resource API
      # (Phase 8). All three speak TLS; only ctrl is mTLS-gated.
      - "${AKASHIC_AUTH_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${AKASHIC_CTRL_HOST_PORT:-8081}:8081"
      - "${AKASHIC_API_HOST_PORT:-8082}:8082"
    volumes:
      - certs:/certs:ro
      # Phase 7: writable home for server-managed key material (OAuth
      # signing keys). Distinct from /certs which is Vault-Agent-managed
      # and read-only. See docker-compose.yml's volumes: keys section.
      - keys:/keys
      # Mount the same config file the host-run uses. Places it at a path
      # covered by the default config-search list (/etc/akashic/) so the
      # server finds it without extra --config flags.
      - ./configs/config.yaml:/etc/akashic/config.yaml:ro
    networks:
      default:
        aliases:
          - akashic.akashic.local
          # ctrl.akashic.local matches the SANs on the mTLS control-server
          # cert (issued by akashic-mtls-ctrl.tpl). The admin-bff connects
          # to this name so cert verification succeeds.
          - ctrl.akashic.local
          # auth.akashic.local matches the auth-server cert's SANs,
          # ready for Phase 7 when the BFF needs OAuth flows.
          - auth.akashic.local
          # api.akashic.local matches the API-server cert's SANs
          # (Phase 8). The portal and the proxy's api.* server block
          # both dial via this name so TLS verification succeeds.
          - api.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # admin-bff: Akashic Admin BFF + FE (Phase 6)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Browser-facing BFF that serves the React admin FE and proxies
  # /api/bootstrap/* requests to the control plane over mTLS.
  #
  # Identity to control plane: bff.akashic.local mTLS client cert
  # (rotated in place by Vault Agent — see
  # services/vault-agent/templates/bff-client.tpl).
  #
  # Browsers reach it through the nginx-proxy server block for
  # admin.akashic.local; never exposed directly on a host port.
  # In production, an additional host-level nginx terminates public-CA
  # HTTPS in front of nginx-proxy. See doc/phase-6-plan.md §7.
  admin-bff:
    # No `profiles:` — admin-bff comes up with the default `docker
    # compose up -d`. Only the akashic server itself is gated by the
    # `app` profile, so operators can run akashic on the host (`go
    # run`) while the BFF + proxy + deps stay in docker. The BFF
    # lazy-inits its OAuth client (see ensureOAuth in pkg/admin_bff/
    # server.go), so it tolerates akashic being absent at boot —
    # login works as soon as akashic comes up, no BFF restart needed.
    build:
      context: .
      dockerfile: ./services/admin-bff/Dockerfile
    container_name: akashic-admin-bff
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      # Note: akashic is intentionally NOT a depends_on here. The BFF
      # is designed to start independently — it lazy-initializes its
      # OAuth client on the first /login request, retrying if the
      # akashic-admin client secret isn't yet on disk. This decouples
      # the BFF and akashic startup orderings: each can boot in any
      # order, restart independently, and recover automatically. Same
      # design works in container mode and host-akashic mode without
      # any startup-ordering hacks.
      #
      # Phase 7: BFF holds OAuth sessions in Redis. We Ping at startup
      # so a misconfigured Redis fails BFF init loudly. Hard dep is
      # appropriate -- without Redis, login is broken.
      redis:
        condition: service_healthy
    environment:
      AKASHIC_BFF_LISTEN_ADDR: ":8082"
      # The control-server cert's SAN list is ctrl.akashic.local +
      # localhost + 127.0.0.1 (see akashic-mtls-ctrl.tpl). Pointing
      # at "ctrl.*" rather than "akashic.*" makes Go's hostname
      # verification succeed without needing -k or InsecureSkipVerify.
      AKASHIC_BFF_CONTROL_URL: https://ctrl.akashic.local:8081
      AKASHIC_BFF_BFF_CERT_FILE: /certs/bff/akashic-ctrl-client.crt
      AKASHIC_BFF_BFF_KEY_FILE: /certs/bff/akashic-ctrl-client.key
      AKASHIC_BFF_BFF_CA_FILE: /certs/bff/mtls-ca.crt
      # Trust X-Forwarded-For from the docker-network range. The
      # nginx-proxy is the only thing that legitimately forwards into
      # us; broadening this would let any container spoof the source IP.
      AKASHIC_BFF_TRUSTED_PROXIES: 172.0.0.0/8
      AKASHIC_BFF_BOOTSTRAP_RATE_LIMIT: "5"
      # ─── Phase 7: OAuth client + Redis-backed sessions ─────────────
      # Issuer URL: this is what the auth-server bakes into the JWT
      # `iss` claim and advertises in /.well-known/openid-configuration.
      # Must match auth-server's AKASHIC_OAUTH_ISSUER exactly so iss
      # validation succeeds during ID-token verification — both pull
      # from the SAME .env variable to stay in lockstep.
      #
      # No port: auth.* goes through nginx-proxy (see
      # services/proxy/nginx.conf's auth.akashic.* server block).
      # The proxy listens on :8280 inside the cluster and a host TLS
      # terminator (or compose's port-mapping) bridges 443 → 8280.
      AKASHIC_BFF_OAUTH_ISSUER: "${AKASHIC_OAUTH_ISSUER:-https://auth.akashic.local}"
      # Internal back-channel URL for /token + /jwks calls. The BFF
      # is server-side and lives in the docker network, so it dials
      # the auth-server through its docker-network alias on its real
      # TLS port — bypasses the host reverse proxy entirely. The
      # auth-server's cert has `auth.akashic.local` in its SAN list,
      # so TLS verification succeeds against this hostname. The
      # token's iss claim is still validated against the PUBLIC issuer
      # above, because that's the cryptographic identity of the IdP.
      AKASHIC_BFF_OAUTH_INTERNAL_URL: "https://auth.akashic.local:8080"
      AKASHIC_BFF_OAUTH_CLIENT_ID: akashic-admin
      # Built-in client secret is written by the akashic-server on
      # first run (pkg/oauth/builtin.go). The /keys volume is mounted
      # ro below.
      AKASHIC_BFF_OAUTH_CLIENT_SECRET_FILE: /keys/oauth/client-secrets/akashic-admin.txt
      # Must equal the redirect_uri registered on the akashic-admin
      # client_services row exactly. Both env vars (the akashic-server's
      # AKASHIC_OAUTH_ADMIN_REDIRECT_URI and this one) read from the
      # same .env entry so they can't drift apart.
      AKASHIC_BFF_OAUTH_REDIRECT_URI: "${AKASHIC_OAUTH_ADMIN_REDIRECT_URI:-https://admin.akashic.local/oauth/callback}"
      AKASHIC_BFF_OAUTH_SCOPES: "openid profile email"
      # CA bundle the BFF trusts when calling the auth-server's TLS.
      # /certs/akashic/auth-ca.crt is the chain that signed the
      # auth-server's leaf cert (see akashic-auth.tpl).
      AKASHIC_BFF_OAUTH_CA_FILE: /certs/akashic/auth-ca.crt
      AKASHIC_BFF_OAUTH_ALLOWED_ROLES: "root,admin"
      AKASHIC_BFF_OAUTH_SESSION_IDLE: "30m"
      AKASHIC_BFF_OAUTH_SESSION_ABSOLUTE: "8h"
      # Redis: the BFF uses logical DB 1 to keep its keyspace
      # separated from the akashic-server (which uses DB 0).
      AKASHIC_BFF_REDIS_ADDR: redis.akashic.local:6379
      AKASHIC_BFF_REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      AKASHIC_BFF_REDIS_DB: "1"
      AKASHIC_BFF_REDIS_TLS_CA_FILE: /certs/redis/ca.crt
      AKASHIC_BFF_REDIS_TLS_SERVER_NAME: redis.akashic.local
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - certs:/certs:ro
      # /keys volume gives the BFF read-only access to the akashic-
      # admin client secret that pkg/oauth/builtin.go wrote at akashic
      # server startup. We mount the *whole* /keys dir ro rather than
      # just the client-secrets subdir because docker-compose bind
      # mounts auto-create missing dirs as root, which would race
      # with akashic-server's 0700 dir creation. ro is enough.
      - keys:/keys:ro
    # Unconditional host-gateway aliases. Lets the BFF reach the
    # auth-server (and control plane) the same way regardless of
    # whether akashic runs in a container (`--profile app`) or on
    # the host (`go run`). Container mode: docker port-forwards
    # `host:8080 → akashic:8080` so the host gateway IP transparently
    # bridges to the container. Host mode: the host akashic binds on
    # 0.0.0.0:8080 directly. Same dial target, same TLS verification
    # against the auth.akashic.local SAN — the BFF doesn't have to
    # know which mode it's running in.
    #
    # Linux note: container mode also requires the akashic container's
    # CONTROL plane port to be reachable from the docker bridge gateway,
    # which means binding it to 0.0.0.0:8081 (instead of the default
    # 127.0.0.1:8081 loopback). Mac/Win Docker Desktop has loopback
    # magic that bridges this transparently, so dev on Mac/Win works
    # as-is. mTLS gates control-plane access either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "ctrl.akashic.local:host-gateway"
    networks:
      default:
        aliases:
          - admin-bff.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # portal: Sample Next.js portal (Phase 8b — sample profile)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Reference implementation showing how a tenant integrates Akashic.
  # Demonstrates BOTH integration patterns at once:
  #   • OAuth + BFF (server-side iron-session, code exchange) for SSR
  #     and bearer-protected server-to-server calls
  #   • Web Component widgets (Phase 8b) for in-page surfaces —
  #     signup, profile, password change, OAuth client management
  #
  # Status: SAMPLE. Not part of the default deployment.
  #   Bring up with:  docker compose --profile sample up -d
  #   Without it,  the bare deployment domain is available for the
  #   tenant's own product to take over (which is what real tenants
  #   pulling Akashic will do — they bring their own website to the
  #   root domain and embed Akashic widgets into it).
  #
  # Reaches Akashic via:
  #   - auth.<domain>: OAuth flow (full-page redirects), /session/token
  #     for in-page widget bearer exchange
  #   - api.<domain>:  resource API + widget bundle hosting
  #     (the BFF holds bearers from OAuth code-exchange; widgets get
  #     their own short-lived bearers via /session/token)
  portal:
    # One of two reference samples. Profile-gated so tenants can pick
    # which to run (or run neither and bring their own product).
    #
    # `sample-nextjs` profile = "tenants with a backend" reference.
    # Demonstrates BFF + iron-session + OAuth code-exchange + widget
    # mounting in a real framework. Use:
    #     docker compose --profile sample-nextjs up -d
    #
    # The complementary `sample-static` profile (services/sample-static/)
    # demonstrates the same widgets in pure HTML for tenants with no
    # backend at all.
    profiles: ["sample-nextjs"]
    build:
      context: .
      dockerfile: ./services/portal/Dockerfile
    container_name: akashic-sample-nextjs
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      # akashic intentionally NOT a depends_on — same decoupling
      # rationale as admin-bff. The portal's OAuth client init
      # (Chapter 3) lazy-loads, so it tolerates akashic being down.
      redis:
        condition: service_healthy
    environment:
      # Branding (BRAND_NAME, TAGLINE, DESCRIPTION, SUPPORT_EMAIL) and
      # the iron-session secret are hardcoded in the sample's source
      # (web/portal/lib/env.ts). Sample is reference code: tenants who
      # want to rebrand fork the repo and replace the literals; mixing
      # those into runtime env conflates akashic-server config with
      # sample-product config.

      # Redis (DB 2 — separate from auth-server's DB 0 and admin-bff's DB 1).
      AKASHIC_PORTAL_REDIS_HOST: redis.akashic.local
      AKASHIC_PORTAL_REDIS_PORT: "6379"
      AKASHIC_PORTAL_REDIS_PASSWORD: "${AKASHIC_DATABASE_REDIS_PASSWORD:-}"
      AKASHIC_PORTAL_REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
      AKASHIC_PORTAL_REDIS_DB: "2"

      # OAuth client. Issuer must match the auth server's /.well-known/
      # openid-configuration (same value admin-bff uses). Client
      # credentials (client_id + client_secret) come from the
      # operator-managed JSON file at /secrets/sample/nextjs.json,
      # written by `akashic-cli clients create --save-credentials-to`.
      # See web/portal/server/oauth.ts for the resolveCredentials path.
      AKASHIC_OAUTH_ISSUER: "${AKASHIC_OAUTH_ISSUER:-https://auth.akashic.example.com}"
      # Deployment-specific callback URL the sample sends to /authorize.
      # Must match exactly what the operator passed to `akashic-cli
      # clients create --redirect-uri ...` when registering this
      # sample, or /authorize returns redirect_uri_mismatch.
      AKASHIC_OAUTH_SAMPLE_NEXTJS_REDIRECT_URI: "${AKASHIC_OAUTH_SAMPLE_NEXTJS_REDIRECT_URI:-https://akashic.example.com/api/auth/callback}"
      AKASHIC_PORTAL_OAUTH_SCOPES: "openid profile email"

      # --- Chapter 3 / 8b: API server URL ---
      # PUBLIC URL — used to render <script src> + <link rel="stylesheet">
      # tags into pages the browser sees, AND as the origin the widget
      # bundle infers for fetch calls. MUST be the URL a browser can
      # actually reach (e.g., https://api.akashic.example.com), NOT the
      # docker-internal alias.
      #
      # Set in .env to your real api.<domain>; the placeholder default
      # below makes it obvious when it's been forgotten because nothing
      # browser-side will work.
      AKASHIC_PORTAL_API_BASE_URL: "${AKASHIC_PORTAL_API_BASE_URL:-https://api.akashic.example.com}"

      TZ: ${AKASHIC_TZ:-UTC}
    entrypoint: ["/usr/local/bin/portal-entrypoint.sh"]
    volumes:
      - certs:/certs:ro
      # /keys read-only for the akashic-sample-nextjs client secret
      # that gets written by EnsureBuiltInClients in Chapter 3 Step 3.2.
      - keys:/keys:ro
      # Operator-managed credentials drop. After running:
      #   akashic-cli clients create --type WEB \
      #     --save-credentials-to .secrets/sample/nextjs.json
      # …the credentials JSON appears at /secrets/sample/nextjs.json
      # inside this container. The Next.js OAuth code reads it on
      # every /authorize call (NOT cached), so post-bootstrap
      # registration takes effect with no portal restart. The
      # transitional EnsureBuiltInClients-managed keys/ path above
      # remains as a fallback during the migration to fully
      # operator-registered samples.
      - ./.secrets/sample:/secrets/sample:ro
    extra_hosts:
      # Phase 8 three-server architecture: the portal speaks ONLY to
      # the auth server (OAuth flows) and the api server (bearer-
      # authenticated resource calls). It never touches the control
      # plane — that's admin-bff/CLI territory. So `ctrl.akashic.local`
      # is intentionally absent from this list.
      - "host.docker.internal:host-gateway"
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "api.akashic.local:host-gateway"
    networks:
      default:
        aliases:
          - portal.akashic.local
          # Shared "active sample" alias — both sample profiles
          # (sample-nextjs and sample-static) export this. The proxy
          # points at it without knowing which sample is up. Mutually
          # exclusive: only one sample can hold the alias at a time
          # because only one container per profile-pair runs.
          - sample-portal

  # ═══════════════════════════════════════════════════════════════════════════════
  # sample-static: Minimal static-HTML widget integration sample (Phase 8b)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Counterpart to `portal:` (the Next.js sample). Demonstrates that
  # the Akashic widgets work in a pure static-HTML site with no
  # framework, no build step, and no backend — sign-in via
  # Authorization Code Flow + PKCE against the akashic-sample-static
  # public OAuth client.
  #
  # ⚠ Mutually exclusive with `portal:` (the Next.js sample): both
  # export the `sample-portal` network alias the proxy points at.
  # Bringing BOTH profiles up at once is permitted by docker but
  # produces broken behaviour — Docker's embedded DNS round-robins
  # between the two containers on each lookup, so the proxy hops
  # randomly between samples per request. Cookies, OAuth callbacks,
  # and sub-resources all break asymmetrically. Pick ONE.
  #
  # Use:
  #     docker compose --profile sample-static up -d
  sample-static:
    profiles: ["sample-static"]
    build:
      context: .
      dockerfile: ./services/sample-static/Dockerfile
    container_name: akashic-sample-static
    restart: unless-stopped
    environment:
      # Public URL the static-HTML pages reference for the widget
      # bundle (envsubst at container start writes it into the HTML
      # files). Same env the Next.js portal reads — single source of
      # truth for "where the widgets live."
      AKASHIC_PORTAL_API_BASE_URL: "${AKASHIC_PORTAL_API_BASE_URL:-https://api.akashic.example.com}"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      # Operator-managed credentials drop. After running:
      #   akashic-cli clients create --type SPA \
      #     --save-credentials-to .secrets/sample/static.json
      # …nginx serves the JSON at /akashic-config.json (see nginx.conf
      # alias). _oauth.js fetches it before any /authorize so a
      # freshly-registered SPA client takes effect with no container
      # restart.
      - ./.secrets/sample:/secrets/sample:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "akashic:host-gateway"
      - "akashic.akashic.local:host-gateway"
      - "auth.akashic.local:host-gateway"
      - "api.akashic.local:host-gateway"
    networks:
      default:
        aliases:
          - sample-portal

networks:
  default:
    name: akashic-net

volumes:
  certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./certs and it is ignored by git and docker)
      device: ./certs
  secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./.secrets and it is ignored by git and docker)
      device: ./.secrets
  # Phase 7: server-managed key material that is NOT Vault-Agent-rendered.
  # Currently holds the OAuth/OIDC JWT signing keys (./keys/oauth/<kid>.json).
  # Mounted writable inside the akashic container, unlike the certs volume
  # which is read-only. This separation keeps Vault-managed and server-
  # managed material in distinct trust domains.
  keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./keys
  pg_data:
  redis_data:
  loki_data:
  grafana_data:
  ldap_data:
  ldap_config:
  redisinsight_data:
  vault_logs:
  vault_file:
  # Placeholders for inherited VOLUME declarations from upstream images.
  # These aren't used for real persistence -- they exist only to prevent
  # Docker from auto-generating anonymous 64-char-hash volumes.
  vault_agent_file:
  vault_agent_logs:
  phpldapadmin_www:
