services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-bootstrap: TLS Certificate Generator (STEP 1/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Generates self-signed Root CA (RSA 4096-bit) and Vault server certificate
  # (RSA 2048-bit) for HTTPS. Output: ./certs/vault/
  #
  # IMPORTANT: vault-root-ca (here) ≠ akashic-root-ca (created later by Vault)
  # - vault-root-ca: For Vault's TLS connection only
  # - akashic-root-ca: For Akashic's PKI system
  #
  # SANs: vault, localhost, 127.0.0.1
  # Idempotent: Skips if certificates exist
  # Troubleshooting: docker compose logs vault-bootstrap
  vault-bootstrap:
    build: ./services/vault/bootstrap
    container_name: akashic-vault-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/vault-bootstrap.sh"]
    volumes:
      - vault_file:/file
      - certs:/certs
      - ./services/vault/bootstrap:/bootstrap
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault: HashiCorp Vault Server (STEP 2/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Secrets management backend. Starts SEALED, initialized by vault-init.
  #
  # Storage: File-based (vault_file volume) - NOT HA-ready
  # Endpoints:
  #   - API: https://localhost:8200 (bound to 127.0.0.1 only)
  #   - UI: https://localhost:8200/ui (login with decrypted root token)
  #   - Cluster: https://localhost:8201
  #
  # Security: IPC_LOCK (no swap), TLS required, localhost-only
  # Access Vault CLI: docker exec -it akashic-vault bash
  # Troubleshooting: docker compose logs vault
  vault:
    build: ./services/vault
    container_name: akashic-vault
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://localhost:8200"
      VAULT_API_ADDR: "https://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
      VAULT_CAPATH: "/vault/certs/vault/root-ca.crt"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Don't expose vault to public
      - "127.0.0.1:${AKASHIC_VAULT_HOST_PORT:-8200}:8200"
      - "127.0.0.1:${AKASHIC_VAULT_CLUSTER_PORT:-8201}:8201"
    volumes:
      - vault_file:/vault/file
      - vault_logs:/vault/logs
      - certs:/vault/certs
      - ./services/vault/config.hcl:/vault/config/vault.hcl:ro
    command: server
    cap_add:
      - IPC_LOCK
    networks:
      default:
        aliases:
          - vault.akashic.local
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/vault/certs/vault/root-ca.crt", "https://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-init: Vault Initialization & PKI Engine Setup (STEP 3/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Three-step process:
  #   1. Initialize Vault (Shamir 5/3, AES-256-GCM encrypted keys)
  #   2. Unseal Vault (SAT-based intelligent key discovery)
  #   3. Mount PKI engines (pki-root, pki-internal, pki-public, pki-mtls-*)
  #
  # Output: ./.secrets/vault/ (root-token.enc + keys/vault-key-*.enc)
  # Engine configs: ./services/vault/init/configs/*.json
  #
  # CRITICAL REQUIREMENTS:
  #   1. AKASHIC_SECRET must be set in .env (32+ chars, never commit)
  #   2. BACKUP ./.secrets/vault/ immediately (loss = permanent vault lockout)
  #   3. Loss of AKASHIC_SECRET = cannot decrypt tokens = no vault access
  #
  # Decrypt tokens (run from host after compiling akashic-cli):
  #   akashic-cli pki token inspect -i ./.secrets/vault/root-token.enc
  #
  # Idempotent: Skips already-initialized/unsealed/mounted steps
  # Manual control: Comment out this service, run akashic-cli commands manually
  # Troubleshooting: docker compose logs vault-init
  vault-init:
    build:
      context: .
      dockerfile: ./services/vault/init/Dockerfile
    container_name: akashic-vault-init
    restart: "no"
    environment:
      AKASHIC_SECRET: "${AKASHIC_SECRET:-}"
      # use docker container's vault address using docker dns
      AKASHIC_VAULT_ADDRESS: "https://vault:8200"
      AKASHIC_VAULT_TLS_CACERT: "/certs/vault/root-ca.crt"
      CERTS_OUTPUT_DIR: "/certs"
      CONFIGS_DIR: "/configs"
      AKASHIC_PKI_CRL_BASE_URL: "${AKASHIC_PKI_CRL_BASE_URL:-http://localhost:8280}"
      VAULT_TOKEN_FILE: "/vault/token/vault/root-token.enc"
      VAULT_KEY_DIR: "/vault/token/vault/keys"
      VAULT_AGENT_OUTPUT_DIR: "/vault/token/vault-agent"
      VAULT_ADMIN_USERNAME: "${AKASHIC_VAULT_USERNAME:-}"
      VAULT_ADMIN_PASSWORD: "${AKASHIC_VAULT_PASSWORD:-}"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - secrets:/vault/token
      - certs:/certs
      - ./services/vault/init/scripts:/scripts:ro
      - ./services/vault/init/configs:/configs:ro
    entrypoint: ["/bin/bash"]
    command: ["/scripts/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-agent: Certificate Lifecycle Manager
  # ═══════════════════════════════════════════════════════════════════════════════
  # Issues and auto-renews leaf certificates via Vault's PKI engines.
  # Authenticates with AppRole (role-id + secret-id from vault-init Step 14).
  #
  # Each template uses a single pkiCert call with writeToFile to produce
  # separate .crt, .key, and ca.pem files. Certs are renewed at ~2/3 TTL.
  #
  # Templates: ./services/vault-agent/templates/*.tpl
  # Manages: postgres, redis, ldap, loki-proxy, akashic-ctrl, akashic-auth,
  #          akashic-mtls-ctrl, akashic-cli-client, bff-client
  # Troubleshooting: docker compose logs vault-agent
  vault-agent:
    build: ./services/vault-agent
    container_name: akashic-vault-agent
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - certs:/certs
      - secrets:/vault-agent/auth:ro
    networks:
      default:
        aliases:
          - vault-agent.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # proxy: Akashic Reverse Proxy (nginx)
  # ═══════════════════════════════════════════════════════════════════════════════
  # General-purpose nginx reverse proxy for the Akashic project.
  # Each port maps to a different service:
  #
  # Port 8280 — PKI: CRL/CA Distribution (Vault)
  #   GET /v1/{engine}/crl      → Certificate Revocation List (DER)
  #   GET /v1/{engine}/crl/pem  → Certificate Revocation List (PEM)
  #   GET /v1/{engine}/ca       → CA Certificate (DER)
  #   GET /v1/{engine}/ca/pem   → CA Certificate (PEM)
  #   All other paths           → 403 Forbidden
  #
  # Add new server blocks in nginx.conf and expose ports here as services grow.
  proxy:
    build: ./services/proxy
    container_name: akashic-proxy
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    environment:
      ADMINER_AUTH_USER: ${AKASHIC_ADMINER_AUTH_USER:-}
      ADMINER_AUTH_PASSWORD: ${AKASHIC_ADMINER_AUTH_PASSWORD:-}
      REDISINSIGHT_AUTH_USER: ${AKASHIC_REDISINSIGHT_AUTH_USER:-}
      REDISINSIGHT_AUTH_PASSWORD: ${AKASHIC_REDISINSIGHT_AUTH_PASSWORD:-}
      PHPLDAPADMIN_AUTH_USER: ${AKASHIC_PHPLDAPADMIN_AUTH_USER:-}
      PHPLDAPADMIN_AUTH_PASSWORD: ${AKASHIC_PHPLDAPADMIN_AUTH_PASSWORD:-}
    ports:
      - "${AKASHIC_NGINX_PORT:-8280}:8280"
    volumes:
      - certs:/certs:ro
    networks:
      default:
        aliases:
          - proxy.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # postgres: PostgreSQL Database (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent, fixes ownership (uid 70),
  # and starts PostgreSQL with SSL enabled.
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS: ssl=on, requires client to verify server cert (sslmode=verify-ca)
  # Troubleshooting: docker compose logs postgres
  postgres:
    build: ./services/postgres
    container_name: akashic-postgres
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    environment:
      POSTGRES_TLS: "${AKASHIC_POSTGRES_TLS:-on}"
      POSTGRES_USER: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AKASHIC_DATABASE_POSTGRES_DB}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - postgres.akashic.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ═══════════════════════════════════════════════════════════════════════════════
  # redis: Redis Cache/Session Store (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent, fixes ownership (uid 999),
  # and starts Redis with TLS on the main port (plain port disabled).
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS hot-reload: cert-watcher uses CONFIG SET (no restart needed)
  # Troubleshooting: docker compose logs redis
  redis:
    build: ./services/redis
    container_name: akashic-redis
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    command: >-
      --appendonly yes
      --save 900 1 --save 300 10 --save 60 10000
      --requirepass ${AKASHIC_DATABASE_REDIS_PASSWORD}
    environment:
      REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
      REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - redis.akashic.local
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ═══════════════════════════════════════════════════════════════════════════════
  # loki: Grafana Loki backend (plain HTTP, internal only)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Stock grafana/loki image, plain HTTP on 3100. Not exposed to the host.
  # TLS termination is handled by the loki-proxy service in front of this.
  #
  # Network alias: loki-runtime.akashic.local (the proxy owns loki.akashic.local)
  # Troubleshooting: docker compose logs loki
  loki:
    image: grafana/loki:3.5.5
    container_name: akashic-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - loki_data:/loki
      - ./services/loki/config.yml:/etc/loki/config.yml:ro
    networks:
      default:
        aliases:
          - loki-runtime.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # loki-proxy: TLS-termination proxy for Loki (internal + 127.0.0.1 host)
  # ═══════════════════════════════════════════════════════════════════════════════
  # nginx that sits in front of Loki. Listens on 3100 -- with TLS when
  # AKASHIC_LOKI_PROXY_TLS=on (default), plain HTTP when off. Forwards to
  # loki-runtime.akashic.local:3100 (plain) in both cases.
  #
  # Accessible from:
  #  - Docker containers in akashic-net: {https,http}://loki.akashic.local:3100
  #  - Host machine (bound to 127.0.0.1): {https,http}://localhost:3100
  #
  # Bound to 127.0.0.1 on the host, so it's NOT publicly reachable -- only
  # processes on the same machine (e.g. the Akashic Go server running on
  # the host) can reach the Loki API via this proxy.
  #
  # Certificates (TLS mode only): issued by vault-agent via pki-internal/server
  # TLS rotation: cert-watcher runs `nginx -s reload` on cert change
  # Troubleshooting: docker compose logs loki-proxy
  loki-proxy:
    build: ./services/loki-proxy
    container_name: akashic-loki-proxy
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      loki:
        condition: service_started
    environment:
      LOKI_TLS_MODE: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Bind to 127.0.0.1 only -- never publicly exposed
      - "127.0.0.1:${AKASHIC_LOKI_PROXY_HOST_PORT:-3100}:3100"
    volumes:
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - loki.akashic.local

  # ═══════════════════════════════════════════════════════════════════════════════
  # grafana: Grafana dashboard
  # ═══════════════════════════════════════════════════════════════════════════════
  # Entrypoint generates /etc/grafana/provisioning/datasources/loki.yml at
  # startup, pointing to https://loki.akashic.local:3100 (the loki-proxy).
  #
  # Accessible via proxy at grafana.<domain>. Has own admin login, so no
  # proxy-level basic auth.
  grafana:
    build: ./services/grafana
    container_name: akashic-grafana
    restart: unless-stopped
    depends_on:
      loki-proxy:
        condition: service_started
    environment:
      LOKI_TLS_MODE: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      GF_SECURITY_ADMIN_USER: ${AKASHIC_GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${AKASHIC_GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      # When running behind a reverse proxy, tell Grafana to trust the
      # X-Forwarded-Proto/Host headers so links and redirects use the
      # external HTTPS URL instead of the internal HTTP URL.
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_PROXY_ENABLED: "false"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - grafana_data:/var/lib/grafana
      - certs:/certs-source:ro
    ports:
      - 127.0.0.1:${AKASHIC_GF_HOST_PORT:-3000}:3000/tcp
      
  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:25000:8080/tcp

  redisinsight:
    build: ./services/redisinsight
    container_name: akashic-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_ENCRYPTION_KEY: "${AKASHIC_SECRET}"
      RI_ENCRYPTION_KEYTAR: "false"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      RI_REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
    ports:
      - 127.0.0.1:25001:5540/tcp
    volumes:
      - redisinsight_data:/data
      - certs:/certs:ro

  # ═══════════════════════════════════════════════════════════════════════════════
  # ldap: OpenLDAP Directory Server (TLS enabled)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Custom entrypoint copies certs from Vault Agent to the writable path
  # osixia/openldap expects (/container/service/slapd/assets/certs/). Works
  # around osixia's aggressive chown behavior on cert files.
  #
  # Certificates: issued by vault-agent via pki-internal/server
  # TLS hot-reload: cert-watcher triggers slapd re-read via ldapmodify
  # Troubleshooting: docker compose logs ldap
  ldap:
    build: ./services/ldap
    container_name: akashic-ldap
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
    environment:
      LDAP_TLS_MODE: "${AKASHIC_LDAP_TLS:-on}"
      LDAP_ORGANISATION: ${AKASHIC_LDAP_ORGANISATION:-Akashic}
      LDAP_DOMAIN: ${AKASHIC_LDAP_DOMAIN:-akashic.local}
      LDAP_ADMIN_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${AKASHIC_LDAP_CONFIG_PASSWORD}
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_LDAP_HOST_PORT:-389}:389"
      - "${AKASHIC_LDAP_LDAPS_HOST_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - certs:/certs-source:ro
    networks:
      default:
        aliases:
          - ldap.akashic.local
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════════
  # phpldapadmin: Web UI for OpenLDAP
  # ═══════════════════════════════════════════════════════════════════════════════
  # Connects to LDAP via LDAPS when TLS is on. The CA cert is mounted so
  # phpldapadmin can verify the LDAP server certificate.
  #
  # Accessible via proxy at phpldapadmin.<domain> (basic auth + rate limit).
  phpldapadmin:
    build: ./services/phpldapadmin
    container_name: akashic-phpldapadmin
    restart: unless-stopped
    depends_on:
      ldap:
        condition: service_healthy
    environment:
      LDAP_TLS_MODE: "${AKASHIC_LDAP_TLS:-on}"
      PHPLDAPADMIN_HTTPS: "false"
      PHPLDAPADMIN_TRUST_PROXY_SSL: "true"
      # Configure LDAP host with StartTLS on port 389 when TLS mode is on.
      # osixia processes #PYTHON2BASH: only for direct Docker env vars (not yaml files).
      # When LDAP_TLS_MODE=off, the entrypoint overwrites this with a plain hostname.
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'ldap.akashic.local': [{'server': [{'tls': True}, {'port': 389}]}, {'login': [{'bind_id': 'cn=admin,dc=akashic,dc=local'}]}]}]"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - 127.0.0.1:${AKASHIC_PHPLDAPADMIN_HOST_PORT:-25002}:80/tcp
    volumes:
      - certs:/certs-source:ro

  # ═══════════════════════════════════════════════════════════════════════════════
  # akashic: Akashic IDP Server (Phase 4)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Container-mode run of the Akashic Go server. Host-mode (`go run ./cmd/akashic
  # run`) remains the default dev flow; enable this service via the `app` profile
  # when you want the full-stack containerized:
  #
  #     docker compose --profile app up -d
  #
  # (All dependency services — postgres, redis, ldap, loki, grafana, etc. — run
  # by default with no profile; only `app` is opt-in.)
  #
  # The server reads TLS on/off per-dependency from .env (AKASHIC_POSTGRES_TLS,
  # AKASHIC_REDIS_TLS, AKASHIC_LDAP_TLS, AKASHIC_LOKI_PROXY_TLS). Certs come
  # from the shared `certs` volume, written by vault-agent in-place, and
  # hot-reloaded by the in-process watcher (AKASHIC_PKI_CERT_WATCHER_ENABLED).
  #
  # Troubleshooting: docker compose logs akashic
  akashic:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ./services/akashic/Dockerfile
    container_name: akashic-server
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Dependency hosts resolve via docker-network aliases inside the container.
      AKASHIC_DATABASE_POSTGRES_HOST: postgres.akashic.local
      AKASHIC_DATABASE_REDIS_HOST: redis.akashic.local
      AKASHIC_LDAP_HOST: ldap.akashic.local
      AKASHIC_LOKI_PROXY_HOST: loki.akashic.local
      # TLS toggles come from .env; re-declared here so `docker compose config`
      # resolves them at the expected point.
      AKASHIC_POSTGRES_TLS: "${AKASHIC_POSTGRES_TLS:-on}"
      AKASHIC_REDIS_TLS: "${AKASHIC_REDIS_TLS:-on}"
      AKASHIC_LDAP_TLS: "${AKASHIC_LDAP_TLS:-on}"
      AKASHIC_LOKI_PROXY_TLS: "${AKASHIC_LOKI_PROXY_TLS:-on}"
      # Credentials
      AKASHIC_DATABASE_POSTGRES_USERNAME: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
      AKASHIC_DATABASE_POSTGRES_PASSWORD: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
      AKASHIC_DATABASE_POSTGRES_DB: ${AKASHIC_DATABASE_POSTGRES_DB}
      AKASHIC_DATABASE_REDIS_PASSWORD: ${AKASHIC_DATABASE_REDIS_PASSWORD}
      AKASHIC_LDAP_ADMIN_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      AKASHIC_SECRET: ${AKASHIC_SECRET}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Auth server: public; Control server: loopback-only.
      - "${AKASHIC_AUTH_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${AKASHIC_CTRL_HOST_PORT:-8081}:8081"
    volumes:
      - certs:/certs:ro
    networks:
      default:
        aliases:
          - akashic.akashic.local

networks:
  default:
    name: akashic-net

volumes:
  certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./certs and it is ignored by git and docker)
      device: ./certs
  secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./.secrets and it is ignored by git and docker)
      device: ./.secrets
  pg_data:
  redis_data:
  loki_data:
  grafana_data:
  ldap_data:
  ldap_config:
  redisinsight_data:
  vault_logs:
  vault_file:
