services:
  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-bootstrap: TLS Certificate Generator (STEP 1/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Generates self-signed Root CA (RSA 4096-bit) and Vault server certificate
  # (RSA 2048-bit) for HTTPS. Output: ./certs/vault/
  #
  # IMPORTANT: vault-root-ca (here) ≠ akashic-root-ca (created later by Vault)
  # - vault-root-ca: For Vault's TLS connection only
  # - akashic-root-ca: For Akashic's PKI system
  #
  # SANs: vault, localhost, 127.0.0.1
  # Idempotent: Skips if certificates exist
  # Troubleshooting: docker compose logs vault-bootstrap
  vault-bootstrap:
    build: ./services/vault/bootstrap
    container_name: akashic-vault-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/vault-bootstrap.sh"]
    volumes:
      - vault_file:/file
      - certs:/certs
      - ./services/vault/bootstrap:/bootstrap
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault: HashiCorp Vault Server (STEP 2/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Secrets management backend. Starts SEALED, initialized by vault-init.
  #
  # Storage: File-based (vault_file volume) - NOT HA-ready
  # Endpoints:
  #   - API: https://localhost:8200 (bound to 127.0.0.1 only)
  #   - UI: https://localhost:8200/ui (login with decrypted root token)
  #   - Cluster: https://localhost:8201
  #
  # Security: IPC_LOCK (no swap), TLS required, localhost-only
  # Access Vault CLI: docker exec -it akashic-vault bash
  # Troubleshooting: docker compose logs vault
  vault:
    build: ./services/vault
    container_name: akashic-vault
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://localhost:8200"
      VAULT_API_ADDR: "https://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
      VAULT_CAPATH: "/vault/certs/vault/root-ca.crt"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Don't expose vault to public
      - "127.0.0.1:${AKASHIC_VAULT_HOST_PORT:-8200}:8200"
      - "127.0.0.1:${AKASHIC_VAULT_CLUSTER_PORT:-8201}:8201"
    volumes:
      - vault_file:/vault/file
      - vault_logs:/vault/logs
      - certs:/vault/certs
      - ./services/vault/config.hcl:/vault/config/vault.hcl:ro
    command: server
    cap_add:
      - IPC_LOCK
    networks:
      default:
        aliases:
          - vault.akashic.local
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/vault/certs/vault/root-ca.crt", "https://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════════
  # vault-init: Vault Initialization & PKI Engine Setup (STEP 3/3)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Three-step process:
  #   1. Initialize Vault (Shamir 5/3, AES-256-GCM encrypted keys)
  #   2. Unseal Vault (SAT-based intelligent key discovery)
  #   3. Mount PKI engines (pki-root, pki-internal, pki-public, pki-mtls-*)
  #
  # Output: ./.secrets/vault/ (root-token.enc + keys/vault-key-*.enc)
  # Engine configs: ./services/vault/init/configs/*.json
  #
  # CRITICAL REQUIREMENTS:
  #   1. AKASHIC_SECRET must be set in .env (32+ chars, never commit)
  #   2. BACKUP ./.secrets/vault/ immediately (loss = permanent vault lockout)
  #   3. Loss of AKASHIC_SECRET = cannot decrypt tokens = no vault access
  #
  # Decrypt tokens (run from host after compiling akashic-cli):
  #   akashic-cli pki token inspect -i ./.secrets/vault/root-token.enc
  #
  # Idempotent: Skips already-initialized/unsealed/mounted steps
  # Manual control: Comment out this service, run akashic-cli commands manually
  # Troubleshooting: docker compose logs vault-init
  vault-init:
    build:
      context: .
      dockerfile: ./services/vault/init/Dockerfile
    container_name: akashic-vault-init
    restart: "no"
    environment:
      AKASHIC_SECRET: "${AKASHIC_SECRET:-}"
      # use docker container's vault address using docker dns
      AKASHIC_VAULT_ADDRESS: "https://vault:8200"
      AKASHIC_VAULT_TLS_CACERT: "/certs/vault/root-ca.crt"
      CERTS_OUTPUT_DIR: "/certs"
      CONFIGS_DIR: "/configs"
      AKASHIC_PKI_CRL_BASE_URL: "${AKASHIC_PKI_CRL_BASE_URL:-http://localhost:8280}"
      VAULT_TOKEN_FILE: "/vault/token/vault/root-token.enc"
      VAULT_KEY_DIR: "/vault/token/vault/keys"
      VAULT_AGENT_OUTPUT_DIR: "/vault/token/vault-agent"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - secrets:/vault/token
      - certs:/certs
      - ./services/vault/init/scripts:/scripts:ro
      - ./services/vault/init/configs:/configs:ro
    entrypoint: ["/bin/bash"]
    command: ["/scripts/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════════════════════
  # proxy: Akashic Reverse Proxy (nginx)
  # ═══════════════════════════════════════════════════════════════════════════════
  # General-purpose nginx reverse proxy for the Akashic project.
  # Each port maps to a different service:
  #
  # Port 8280 — PKI: CRL/CA Distribution (Vault)
  #   GET /v1/{engine}/crl      → Certificate Revocation List (DER)
  #   GET /v1/{engine}/crl/pem  → Certificate Revocation List (PEM)
  #   GET /v1/{engine}/ca       → CA Certificate (DER)
  #   GET /v1/{engine}/ca/pem   → CA Certificate (PEM)
  #   All other paths           → 403 Forbidden
  #
  # Add new server blocks in nginx.conf and expose ports here as services grow.
  proxy:
    build: ./services/proxy
    container_name: akashic-proxy
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "${AKASHIC_NGINX_PORT:-8280}:8280"
    networks:
      default:
        aliases:
          - proxy.akashic.local

