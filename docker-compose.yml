services:
  # vault-bootstrap prepares TLS certificates for secure vault connection.
  # It also configures volume permission settings.
  # The output certificates are located in certs volume. To configure host location
  # for certificate files, see the volumes section below.
  # This bootstrap is idempotent - it can be run multiple times without causing any issues.
  vault-bootstrap:
    build: ./services/vault/bootstrap
    container_name: akashic-vault-bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/vault-bootstrap.sh"]
    volumes:
      - vault_file:/file
      - certs:/certs
      - ./services/vault/bootstrap:/bootstrap
    restart: "no"

  # vault is the main service that will be used to store and manage secrets.
  # It uses the TLS certificates provided by vault-bootstrap.
  # The output certificates are located in certs volume.
  # You may exec into this container to interact with vault CLI (use command below):
  # >> docker exec -it akashic-vault bash
  # Note that vault is bound to localhost to block external access. You may only access
  # vault from your host machine or other containers on same network.
  vault:
    build: ./services/vault
    container_name: akashic-vault
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://localhost:8200"
      VAULT_API_ADDR: "https://vault:8200"
      VAULT_CLUSTER_ADDR: "https://vault:8201"
      VAULT_CAPATH: "/vault/certs/vault/root-ca.crt"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      # Don't expose vault to public
      - "127.0.0.1:${AKASHIC_VAULT_HOST_PORT:-8200}:8200"
      - "127.0.0.1:${AKASHIC_VAULT_CLUSTER_PORT:-8201}:8201"
    volumes:
      - vault_file:/vault/file
      - vault_logs:/vault/logs
      - certs:/vault/certs
      - ./services/vault/config.hcl:/vault/config/vault.hcl:ro
    command: server
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/vault/certs/vault/root-ca.crt", "https://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # vault-init is used to initialize, unseal, and configure vault for the project.
  # It uses akashic-cli internally to interact with the vault.
  # This container run will automatically unseal the vault when the docker-compose starts,
  # If you want to control the process manually, comment out the service.
  # This init is idempotent - it can be run multiple times without causing any issues.
  vault-init:
    build:
      context: .
      dockerfile: ./services/vault/init/Dockerfile
    container_name: akashic-vault-init
    restart: "no"
    environment:
      AKASHIC_SECRET: "${AKASHIC_SECRET:-}"
      # use docker container's vault address using docker dns
      AKASHIC_VAULT_ADDRESS: "https://vault:8200" 
      AKASHIC_VAULT_TLS_CACERT: "/certs/vault/root-ca.crt"
      CERTS_OUTPUT_DIR: "/certs"
      VAULT_TOKEN_FILE: "/vault/token/vault/root-token.enc"
      VAULT_KEY_DIR: "/vault/token/vault/keys"
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - secrets:/vault/token
      - certs:/certs
      - ./services/vault/init/scripts:/scripts:ro
    entrypoint: ["/bin/bash"]
    command: ["/scripts/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy

