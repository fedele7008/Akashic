networks:
  default:
    name: akashic-net

volumes:
  certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./certs and it is ignored by git and docker)
      device: ./certs
  secrets:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this path with your desired path (default is ./.secrets and it is ignored by git and docker)
      device: ./.secrets
  pg_data:
  redis_data:
  loki_data:
  grafana_data:
  ldap_data:
  ldap_config:
  vault_logs:
  vault_file:
