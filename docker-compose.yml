services:
  # ============================================================================
  # Init Container - PKI Setup and Certificate Generation
  # ============================================================================
  # This service runs first and sets up all required certificates.
  # It enables "clone and run" deployment with zero manual configuration.
  cert-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: akashic-cert-init
    volumes:
      - ./certs:/app/certs
      - ./scripts:/app/scripts
      - ./build:/app/build
    environment:
      AKASHIC_USE_BUNDLED_LDAP: ${AKASHIC_USE_BUNDLED_LDAP:-true}
      AKASHIC_USE_BUNDLED_BFF: ${AKASHIC_USE_BUNDLED_BFF:-true}
    command: ["/app/scripts/init/setup-all.sh"]
    networks:
      - default

  # ============================================================================
  # Akashic IDP Server - Core Authentication Service
  # ============================================================================
  akashic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akashic-server
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_AUTH_SERVER_PORT:-8080}:8080"
      - "${AKASHIC_CONTROL_SERVER_PORT:-8081}:8081"
    volumes:
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PostgreSQL Database - Persistent Data Storage
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: akashic-postgres
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AKASHIC_DATABASE_POSTGRES_DB}
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AKASHIC_DATABASE_POSTGRES_USERNAME} -d $${AKASHIC_DATABASE_POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ============================================================================
  # Redis - Session and Cache Storage
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: akashic-redis
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
    command: >
      sh -c "redis-server
      --appendonly yes
      --save 900 1 --save 300 10 --save 60 10000
      --requirepass ${AKASHIC_DATABASE_REDIS_PASSWORD}"
    environment:
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_DATABASE_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AKASHIC_DATABASE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ============================================================================
  # Loki - Log Aggregation (Observability Profile)
  # ============================================================================
  loki:
    image: grafana/loki:3.5.5
    container_name: akashic-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "${AKASHIC_LOKI_HOST_PORT:-3100}:3100"
    networks:
      - default
    profiles:
      - obs

  # ============================================================================
  # Grafana - Metrics and Logs Visualization (Observability Profile)
  # ============================================================================
  grafana:
    image: grafana/grafana
    container_name: akashic-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${AKASHIC_GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${AKASHIC_GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      TZ: ${AKASHIC_TZ:-UTC}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${AKASHIC_GF_HOST_PORT:-3000}:3000"
    depends_on:
      - loki
    networks:
      - default
    profiles:
      - obs
      
  # ============================================================================
  # Adminer - Database Management Tool (Optional)
  # ============================================================================
  adminer:
    image: adminer
    container_name: akashic-adminer
    restart: unless-stopped
    ports:
      - "${AKASHIC_ADMINER_HOST_PORT:-25000}:8080"
    networks:
      - default

  # ============================================================================
  # OpenLDAP - Directory Server (LDAP Profile)
  # ============================================================================
  # Bundled LDAP server for user authentication and directory services.
  # Can be replaced with external LDAP by setting AKASHIC_USE_BUNDLED_LDAP=false
  ldap:
    image: osixia/openldap:1.5.0
    container_name: akashic-ldap
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      LDAP_ORGANISATION: ${AKASHIC_LDAP_ORGANISATION:-Akashic}
      LDAP_DOMAIN: ${AKASHIC_LDAP_DOMAIN:-akashic.local}
      LDAP_ADMIN_PASSWORD: ${AKASHIC_LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${AKASHIC_LDAP_CONFIG_PASSWORD}
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      TZ: ${AKASHIC_TZ:-UTC}
      # TLS Configuration
      LDAP_TLS: "${AKASHIC_LDAP_TLS_ENABLED:-false}"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_VERIFY_CLIENT: "never"
    ports:
      - "${AKASHIC_LDAP_HOST_PORT:-389}:389"
      - "${AKASHIC_LDAP_LDAPS_HOST_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./certs/compat/ldap:/container/service/slapd/assets/certs:ro
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=akashic,dc=local -D cn=admin,dc=akashic,dc=local -w $${AKASHIC_LDAP_ADMIN_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - ldap

  # ============================================================================
  # phpLDAPadmin - LDAP Web Management Interface (LDAP Profile)
  # ============================================================================
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: akashic-phpldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
      TZ: ${AKASHIC_TZ:-UTC}
    ports:
      - "${AKASHIC_PHPLDAPADMIN_HOST_PORT:-8090}:80"
    depends_on:
      ldap:
        condition: service_healthy
    networks:
      - default
    profiles:
      - ldap

networks:
  default:
    name: akashic-net

volumes:
  pg_data:
  redis_data:
  loki_data:
  grafana_data:
  ldap_data:
  ldap_config:
