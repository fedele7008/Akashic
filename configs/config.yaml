server:
  auth:
    host: "0.0.0.0"
    port: 8080
    tls:
      enabled: true
      # Server cert for the public OAuth/OIDC listener. Issued from
      # pki-internal via services/vault-agent/templates/akashic-auth.tpl.
      cert_file: "./certs/akashic/auth.crt"
      key_file: "./certs/akashic/auth.key"
  control:
    host: "127.0.0.1"
    port: 8081
    tls:
      enabled: true
      # Server cert presented by the control plane. Issued from the private
      # pki-mtls-akashic-ctrl CA via services/vault-agent/templates/akashic-mtls-ctrl.tpl.
      cert_file: "./certs/akashic/mtls-ctrl.crt"
      key_file: "./certs/akashic/mtls-ctrl.key"
      # CA used to verify INCOMING client certs (akashic-cli, bff). Same
      # pki-mtls-akashic-ctrl CA; this file is the CA chain written by the
      # same template above.
      ca_file: "./certs/akashic/mtls-ca.crt"
      client_auth_required: true
database:
  postgres:
    host: "localhost"
    port: ${AKASHIC_DATABASE_POSTGRES_HOST_PORT}
    database: ${AKASHIC_DATABASE_POSTGRES_DB}
    username: ${AKASHIC_DATABASE_POSTGRES_USERNAME}
    password: ${AKASHIC_DATABASE_POSTGRES_PASSWORD}
    # Only consulted when tls.enabled is true (controlled by AKASHIC_POSTGRES_TLS).
    # Valid values: verify-full, verify-ca, require. When tls.enabled is false
    # the client forces sslmode=disable internally regardless of this setting.
    ssl_mode: "verify-full"
    max_connections: 100
    max_idle_connections: 10
    connection_lifetime: "1h"
  redis:
    host: "localhost"
    port: 6379
    password: ${AKASHIC_DATABASE_REDIS_PASSWORD}
    db: 0
    pool_size: 10
    session_ttl: "24h"
    cache_ttl: "1h"
session:
  timeout: "30m"
  secure_cookies: true
  same_site: "Strict"
  cookie_name: "akashic_session"
  cookie_path: "/"
logging:
  service_name: "akashic"
  encoder:
    timestamp_key: "timestamp"
    time_format: "Mon Jan _2 15:04:05 MST 2006" # UnixDate
    level_key: "level"
    name_key: "logging"
    caller_key: "caller"
    message_key: "message"
    stacktrace_key: "stacktrace"
  app:
    enabled: true
    show_caller: true
    show_stacktrace: true
    stacktrace_level: "error" # debug, info, warn, error, fatal
    sinks:
      - type: "stdout" # stdout, stderr, file, loki
        enabled: true
        level: "debug" # debug, info, warn, error, fatal
        format: "text" # json, text
      - type: "file"
        enabled: true
        level: "debug"
        format: "text"
        file_path: "./logs/app.log"
        file_mode: "rolling" # append, truncate, rolling
      - type: "loki"
        enabled: true
        level: "debug"
        loki_url: "${AKASHIC_LOKI_API_URL}"
        compress: true
  security:
    enabled: true
    show_caller: true
    show_stacktrace: true
    stacktrace_level: "error" # debug, info, warn, error, fatal
    sinks:
      - type: "stdout" # stdout, stderr, file, loki
        enabled: true
        level: "debug" # debug, info, warn, error, fatal
        format: "text" # json, text
      - type: "file"
        enabled: true
        level: "debug"
        format: "text"
        file_path: "./logs/security.log"
        file_mode: "append" # append, truncate, rolling
      - type: "loki"
        enabled: true
        level: "debug"
        loki_url: "${AKASHIC_LOKI_API_URL}"
        compress: true
  audit:
    enabled: true
    show_caller: true
    show_stacktrace: true
    stacktrace_level: "error" # debug, info, warn, error, fatal
    sinks:
      - type: "stdout" # stdout, stderr, file, loki
        enabled: true
        level: "debug" # debug, info, warn, error, fatal
        format: "text" # json, text
      - type: "file"
        enabled: true
        level: "debug"
        format: "text"
        file_path: "./logs/audit.log"
        file_mode: "append" # append, truncate, rolling
      - type: "loki"
        enabled: true
        level: "debug"
        loki_url: "${AKASHIC_LOKI_API_URL}"
        compress: true
middleware:
  # Auth Server Middleware (OAuth/OIDC endpoints - public-facing)
  auth:
    # Security Headers - HTTP security headers for browser protection
    security_headers:
      x_frame_options: "DENY"  # DENY | SAMEORIGIN - prevents clickjacking
      x_xss_protection: "1; mode=block"  # 0 | 1 | 1; mode=block - XSS filter for legacy browsers
      hsts_max_age: 31536000  # seconds (1 year) - HTTPS enforcement duration, 0 disables
      hsts_include_subdomains: true  # apply HSTS to all subdomains
      hsts_preload: false  # include in browser preload lists (requires manual submission)
      content_security_policy: "default-src 'self'"  # CSP policy - restricts resource loading
      remove_server_header: true  # remove Server header to prevent fingerprinting

    # CORS - Cross-Origin Resource Sharing (for SPA/web clients)
    cors:
      enabled: false  # MUST be explicitly enabled and configured
      allowed_origins: []  # ["https://app.example.com", "https://admin.example.com"]
      # allowed_origins: ["*"]  # WARNING: Allow all origins (not recommended for production)
      allowed_methods: ["GET", "POST", "OPTIONS"]
      allowed_headers: ["Content-Type", "Authorization", "X-Request-ID"]
      exposed_headers: ["X-Request-ID"]
      allow_credentials: true  # allow cookies/auth headers
      max_age: 3600  # preflight cache duration in seconds (1 hour)

    # Rate Limiting - Prevent abuse and DoS attacks
    rate_limit:
      enabled: false  # disabled by default - enable for production
      requests_per_window: 100  # max requests allowed per window
      window_duration: "1m"  # time window: 1m, 5m, 1h, etc.

    # Logging - Request/response logging configuration
    logging:
      skip_paths: [] # ["/health"] - paths to skip logging

    # Request Limits
    max_request_size_bytes: 5242880  # 5MB - max request body size
    request_timeout: "30s"  # request processing timeout

  # Control Server Middleware (Admin/management API - restricted access)
  control:
    # Security Headers - same options as auth server
    security_headers:
      x_frame_options: "DENY"
      x_xss_protection: "1; mode=block"
      hsts_max_age: 31536000
      hsts_include_subdomains: true
      hsts_preload: false
      content_security_policy: "default-src 'self'"
      remove_server_header: true

    # IP Allowlist - Restrict access by IP address
    ip_allowlist:
      enabled: false  # disabled by default
      allowed_ips: []  # ["192.168.1.0/24", "10.0.0.5"] - IPs and CIDR ranges
      allow_loopback: true  # always allow 127.0.0.1 and ::1
      trust_proxy: false  # trust X-Forwarded-For header (only if behind proxy)

    # CORS - for BFF or admin UI access
    cors:
      enabled: false  # disabled by default
      allowed_origins: []  # ["https://admin.example.com"]
      allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowed_headers: ["Content-Type", "Authorization", "X-Request-ID", "X-Client-Cert-DN"]
      exposed_headers: ["X-Request-ID"]
      allow_credentials: true
      max_age: 7200  # 2 hours

    # Rate Limiting - More permissive for admin clients
    rate_limit:
      enabled: false
      requests_per_window: 200  # higher limit for admin operations
      window_duration: "1m"

    # Logging
    logging:
      skip_paths: [] # ["/health"] - paths to skip logging

    # Request Limits
    max_request_size_bytes: 1048576  # 1MB - smaller for control operations
    request_timeout: "60s"  # longer timeout for admin operations

deployment:
  environment: "development"  # development, staging, production

bootstrap:
  # Bootstrap token time-to-live (regeneration invalidates old token)
  token_ttl: "1h"  # 1 hour default

  # Password policy for root user creation
  password:
    min_length: 8  # Minimum password length
    require_uppercase: false  # Require at least one uppercase letter
    require_number: true  # Require at least one number
    require_special: false  # Require at least one special character

# LDAP Configuration
# Configure connection to LDAP server (embedded or external)
# For embedded: Use "ldap" as host (Docker service name)
# For external: Use your LDAP server hostname/IP
ldap:
  # Connection settings
  host: localhost  # Docker service name for embedded, or "ldap.company.com" for external
  port: 389     # 389 for LDAP, 636 for LDAPS
  base_dn: "dc=akashic,dc=local"

  # Bind credentials (admin account for Akashic to use)
  bind_dn: "cn=admin,dc=akashic,dc=local"
  bind_password: "${AKASHIC_LDAP_ADMIN_PASSWORD}"

  # TLS settings. AKASHIC_LDAP_TLS=on|off in .env flips use_tls at runtime;
  # tls_mode infers from port: 389 → starttls, 636 → ldaps (override via
  # AKASHIC_LDAP_TLS_MODE=starttls|ldaps|plain or the tls_mode key here).
  use_tls: true
  tls_skip_verify: false   # Set to true for dev/self-signed certs (INSECURE)
  tls_ca_cert: "./certs/ca/trust/trust-bundle.pem"
  # tls_mode: ""           # leave empty to infer from port; set explicitly for non-standard ports

  # User search configuration
  user_search_base: "ou=users,dc=akashic,dc=local"
  user_search_filter: "(uid={username})"  # {username} is replaced with actual username
  user_object_class: "inetOrgPerson"

  # Attribute mapping (LDAP attribute names)
  username_attr: "uid"           # Attribute containing username
  email_attr: "mail"             # Attribute containing email
  display_name_attr: "cn"        # Attribute containing display name

  # RBAC (Role-Based Access Control) configuration
  rbac:
    # LDAP groups for different user types
    root_group: "cn=akashic-root,ou=groups,dc=akashic,dc=local"
    admin_group: "cn=akashic-admins,ou=groups,dc=akashic,dc=local"
    user_group: "cn=akashic-users,ou=groups,dc=akashic,dc=local"
    # Default user type when no group membership found (user/admin/root)
    default_type: "user"

  # Deprovisioning configuration
  deprovisioning:
    enabled: true
    sync_interval: "1h"           # How often to check for missing LDAP entries

    # Deletion thresholds when LDAP entry is missing
    root_deletion_threshold: "0s"     # Root accounts deleted immediately
    admin_deletion_threshold: "720h"  # Admin accounts after 30 days
    user_deletion_threshold: "2160h"  # Regular users after 90 days
