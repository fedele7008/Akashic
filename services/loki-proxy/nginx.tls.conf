# ═══════════════════════════════════════════════════════════════
# Akashic Loki TLS-Termination Proxy (Internal + 127.0.0.1 host only)
# ═══════════════════════════════════════════════════════════════
# Listens on port 3100 (TLS) in akashic-net, forwards plain HTTP
# to loki-runtime.akashic.local:3100.
#
# Accessible from:
#  - Docker containers in akashic-net: https://loki.akashic.local:3100
#  - Host machine (bound to 127.0.0.1): https://localhost:3100
#
# Not exposed to the public network -- only bound to 127.0.0.1 on the host.
#
# Why: Loki in single-binary mode doesn't cleanly support TLS on
# its own HTTP listener (internal components speak plain HTTP to
# themselves). By terminating TLS here and forwarding plain HTTP,
# we get encrypted Loki access without Loki's self-talk problems.
# ═══════════════════════════════════════════════════════════════

# Resolve upstream at request time (Docker DNS) so nginx starts
# even if the Loki backend isn't running yet.
resolver 127.0.0.11 valid=30s;

server {
    listen 3100 ssl;
    server_name loki.akashic.local localhost;

    ssl_certificate     /certs/loki.crt;
    ssl_certificate_key /certs/loki.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Log only errors -- access logs for an internal proxy are noise
    access_log off;

    location / {
        set $upstream_loki http://loki-runtime.akashic.local:3100;
        proxy_pass $upstream_loki;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Loki log pushes can be large; bump body size and read timeout.
        client_max_body_size 100M;
        proxy_read_timeout   60s;
        proxy_http_version   1.1;
    }
}
