# ═══════════════════════════════════════════════════════════════
# Akashic Loki Plain-HTTP Proxy (Internal + 127.0.0.1 host only)
# ═══════════════════════════════════════════════════════════════
# TLS-off variant: listens plain HTTP on port 3100 and forwards to
# loki-runtime.akashic.local:3100.
# ═══════════════════════════════════════════════════════════════

resolver 127.0.0.11 valid=30s;

server {
    listen 3100;
    server_name loki.akashic.local localhost;

    access_log off;

    location / {
        set $upstream_loki http://loki-runtime.akashic.local:3100;
        proxy_pass $upstream_loki;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 100M;
        proxy_read_timeout   60s;
        proxy_http_version   1.1;
    }
}
