auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # TLS only on HTTP (external-facing). Internal Loki components
  # (frontend, ingester, querier, scheduler) talk to each other via
  # gRPC on port 9096 over loopback, so we keep that plain to avoid
  # having to configure client-side TLS for every internal connection.
  http_tls_config:
    cert_file: /certs/loki.crt
    key_file: /certs/loki.key

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093
