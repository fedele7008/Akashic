<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change ID — Akashic Sample</title>
  <link rel="stylesheet" href="${AKASHIC_PORTAL_API_BASE_URL}/widgets/akashic-default.css" />
  <script src="${AKASHIC_PORTAL_API_BASE_URL}/widgets/akashic.js" type="module"></script>
  <script src="/_oauth.js"></script>
  <style>
    body { max-width: 32rem; margin: 0 auto; padding: 2rem 1rem;
           font-family: system-ui, sans-serif; color: #e4e6eb; background: #0f1115; }
    a { color: #4f8cff; }
    p.lede { color: #b1b5be; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Change account ID</h1>
  <p class="lede">
    Rotate your <code>id#TAG</code> handle. The operator-configured
    cooldown applies between successive changes.
  </p>
  <akashic-change-id></akashic-change-id>
  <p style="margin-top: 1.5rem;">
    <a href="/profile">← Back to profile</a>
  </p>
  <script>
    document.addEventListener("akashic-needs-signin", function () {
      AkashicOAuth.signin();
    });
  </script>
</body>
</html>
