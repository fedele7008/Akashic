server {
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Friendly URLs: /signup → /signup.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long cache on the bundle/CSS pulled from api.<tenant>; keep
    # the local HTML at default (etag/last-modified).
    location ~* \.(html?)$ {
        add_header Cache-Control "no-cache";
    }

    # Operator-managed credentials drop. The host's
    # `.secrets/sample/static.json` (written by `akashic-cli clients
    # create --save-credentials-to ...`) is mounted into the container
    # at /secrets/sample/. Surface it to the SPA at a stable URL so
    # _oauth.js can fetch the dynamically-issued client_id without
    # rebuilding the image.
    #
    # Always served fresh (no-cache) — operator rotations should take
    # effect on the next /authorize click. 404 if the operator hasn't
    # run `clients create` yet; _oauth.js renders a friendly message.
    location = /akashic-config.json {
        alias /secrets/sample/static.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
}
