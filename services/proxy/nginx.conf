# ═══════════════════════════════════════════════════════════════
# Akashic Reverse Proxy — Subdomain-based Routing
# ═══════════════════════════════════════════════════════════════
# Routes browser-facing services by subdomain prefix.
# Works with any base domain — only the prefix matters.
#
# Examples with akashic.yohan-yoon.com:
#   grafana.akashic.yohan-yoon.com   → grafana:3000
#   vault.akashic.yohan-yoon.com     → vault:8200
#   adminer.akashic.yohan-yoon.com   → adminer:8080
#   ldapadmin.akashic.yohan-yoon.com → phpldapadmin:80
#   pki.akashic.yohan-yoon.com       → vault:8281 (CRL/CA only)
#
# Without a domain, access services directly via their ports.

# ─────────────────────────────────────────────────────────────
# PKI: CRL and CA Certificate Distribution
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^pki\.;

    location ~ ^/v1/[^/]+/crl(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location ~ ^/v1/[^/]+/ca(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location / {
        return 403 '{"error": "forbidden"}';
        add_header Content-Type application/json;
    }
}

# ─────────────────────────────────────────────────────────────
# Vault UI
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^vault\.;

    location / {
        proxy_pass https://vault:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/vault/root-ca.crt;
        proxy_ssl_server_name on;
    }
}

# ─────────────────────────────────────────────────────────────
# Grafana (requires obs profile)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^grafana\.;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support for Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────
# Adminer (database UI)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^adminer\.;

    location / {
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────────────────────
# phpLDAPadmin (requires ldap profile)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^ldapadmin\.;

    location / {
        proxy_pass http://phpldapadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────────────────────
# Default: deny unmatched subdomains
# ─────────────────────────────────────────────────────────────
server {
    listen 8280 default_server;

    location / {
        return 403 '{"error": "unknown subdomain"}';
        add_header Content-Type application/json;
    }
}
