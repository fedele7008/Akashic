# ═══════════════════════════════════════════════════════════════
# Akashic Reverse Proxy
# ═══════════════════════════════════════════════════════════════
# General-purpose nginx reverse proxy for the Akashic project.
# Each server block handles a different port/service.
# Add new server blocks as services are added.

# Preserve X-Forwarded-Proto from upstream if set, otherwise use local scheme.
# This is critical when a host-level reverse proxy terminates HTTPS in front
# of this proxy -- without this map, we'd overwrite the upstream's "https"
# header with our own "http" scheme, making downstream apps think the
# browser-facing connection is unencrypted.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ─────────────────────────────────────────────────────────────
# PKI: CRL and CA Certificate Distribution (port 8280)
# ─────────────────────────────────────────────────────────────
# Proxies read-only, unauthenticated Vault PKI endpoints.
# All other Vault paths are denied.
server {
    listen 8280;

    location ~ ^/v1/[^/]+/crl(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location ~ ^/v1/[^/]+/ca(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location / {
        return 403 '{"error": "forbidden"}';
        add_header Content-Type application/json;
    }
}

# ─────────────────────────────────────────────────────────────
# Vault UI (vault.* subdomain -> vault:8200 HTTPS)
# ─────────────────────────────────────────────────────────────
# Vault has its own auth (token/userpass/etc), no proxy-level auth needed.
server {
    listen 8280;
    server_name ~^vault\.;

    location / {
        proxy_pass https://vault:8200;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/vault/root-ca.crt;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support (Vault UI uses it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Rate limit zones (5 req/s per IP, shared across admin UIs)
limit_req_zone $binary_remote_addr zone=adminer_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=redisinsight_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=phpldapadmin_limit:10m rate=5r/s;
# Phase 6: admin.* gets a generous nginx-level rate-limit since the BFF
# does its own per-IP throttling at the application layer for the
# bootstrap-create-root path. The nginx limit here exists as a coarse
# DoS shield on top of that.
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/s;
# Phase 7: auth.* serves the public OIDC IdP surface (login UI,
# /authorize, /token, /userinfo, JWKS, discovery doc). The auth-server
# does its own per-IP rate-limiting on /login/submit (5/min) and
# global middleware on the rest, so this nginx limit is again a
# coarse DoS shield on top of application-layer throttling.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;

# ─────────────────────────────────────────────────────────────
# Adminer (database UI)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^adminer\.;

    include /etc/nginx/adminer-auth.conf;

    limit_req zone=adminer_limit burst=20 nodelay;
    limit_req_status 429;

    # Resolve upstream at request time (not config load) so nginx
    # starts even if the service container isn't running yet
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_adminer http://adminer:8080;
        proxy_pass $upstream_adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ─────────────────────────────────────────────────────────────
# RedisInsight (Redis GUI)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^redisinsight\.;

    include /etc/nginx/redisinsight-auth.conf;

    # Resolve upstream at request time
    resolver 127.0.0.11 valid=30s;

    # Static assets (no rate limit — SPA loads ~50+ JS chunks on page load)
    location /assets/ {
        set $upstream_redisinsight_assets http://redisinsight:5540;
        proxy_pass $upstream_redisinsight_assets;
        proxy_set_header Host $host;
    }

    # API and pages (rate limited)
    location / {
        limit_req zone=redisinsight_limit burst=20 nodelay;
        limit_req_status 429;

        set $upstream_redisinsight http://redisinsight:5540;
        proxy_pass $upstream_redisinsight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support (RedisInsight uses it)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────
# Grafana (observability dashboard)
# ─────────────────────────────────────────────────────────────
# Has its own admin login -- no proxy-level auth needed.
server {
    listen 8280;
    server_name ~^grafana\.;

    # Resolve upstream at request time
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Grafana uses websockets for live tail and alerts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────
# admin.akashic.* — Akashic admin BFF + FE (Phase 6)
# ─────────────────────────────────────────────────────────────
# Routes browser traffic for the admin UI to the admin-bff service,
# which serves both the React FE (embedded) and the /api/* endpoints
# that proxy to the control plane over mTLS.
#
# In production, a host-level nginx terminates public-CA HTTPS in
# front of this and forwards as plain HTTP to 127.0.0.1:8280. In
# direct-dev mode (no host nginx), the operator hits this URL directly
# at http://admin.akashic.local:8280 -- the BFF detects the missing
# X-Forwarded-Proto and adapts (e.g., omits Secure on the CSRF cookie).
server {
    listen 8280;
    server_name ~^admin\.;

    # Coarse DoS shield. Real per-IP rate limiting for the bootstrap
    # endpoint happens inside the BFF itself (5 req/min, see
    # pkg/admin_bff/ratelimit.go).
    limit_req zone=admin_limit burst=40 nodelay;
    limit_req_status 429;

    # Resolve upstream at request time (lets nginx start before the
    # admin-bff container is up; otherwise nginx fails on first
    # `--profile app up` before the BFF is reachable)
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_admin_bff http://admin-bff:8082;
        proxy_pass $upstream_admin_bff;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ─────────────────────────────────────────────────────────────
# auth.akashic.* — Akashic auth-server / OIDC IdP (Phase 7)
# ─────────────────────────────────────────────────────────────
# Routes browser traffic for the OAuth/OIDC IdP to the akashic-server's
# auth listener (port 8080, TLS-only). Unlike the admin-bff (plain
# HTTP upstream), the auth listener is HTTPS-only with a cert from
# pki-internal — so this is a TLS-to-TLS proxy, same pattern as the
# vault.* block above.
#
# Why route through nginx-proxy at all when port 8080 is already
# published on the host: it lets the browser-facing URL share a
# single port (8280) with admin.* and other subdomains. Without this,
# the OAuth issuer URL has to include `:8080`, which means the user
# needs DNS resolution for `auth.akashic.local` AND has to accept the
# self-signed cert separately on that port. With nginx-proxy in front,
# auth.akashic.local goes through whatever TLS terminator already
# fronts admin.akashic.local (host nginx, Caddy, etc.).
server {
    listen 8280;
    server_name ~^auth\.;

    limit_req zone=auth_limit burst=40 nodelay;
    limit_req_status 429;

    # Resolve upstream at request time so nginx can start before the
    # akashic container is up.
    resolver 127.0.0.11 valid=30s;

    location / {
        # TLS-to-TLS proxy. The akashic auth-server's cert is signed
        # by pki-internal (see services/vault-agent/templates/akashic-auth.tpl);
        # we trust the chain at /certs/akashic/auth-ca.crt, which Vault
        # Agent renders alongside the leaf cert.
        set $upstream_auth https://akashic:8080;
        proxy_pass $upstream_auth;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/akashic/auth-ca.crt;
        # auth.akashic.local is in the cert's SAN list, so SNI just works.
        proxy_ssl_server_name on;
        proxy_ssl_name auth.akashic.local;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ─────────────────────────────────────────────────────────────
# phpLDAPadmin (LDAP GUI)
# ─────────────────────────────────────────────────────────────
server {
    listen 8280;
    server_name ~^phpldapadmin\.;

    include /etc/nginx/phpldapadmin-auth.conf;

    limit_req zone=phpldapadmin_limit burst=20 nodelay;
    limit_req_status 429;

    # Resolve upstream at request time
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_phpldapadmin http://phpldapadmin:80;
        proxy_pass $upstream_phpldapadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
