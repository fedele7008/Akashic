# ═══════════════════════════════════════════════════════════════
# Akashic Reverse Proxy — HYBRID HOST-AKASHIC variant
# ═══════════════════════════════════════════════════════════════
# Used by docker-compose.host-akashic.yml when akashic runs on the
# host instead of inside docker. Differs from nginx.conf in exactly
# ONE place: the auth.* server block uses static `proxy_pass` so the
# upstream hostname (`akashic`) is resolved at config-load via libc
# (which checks /etc/hosts), instead of via the runtime DNS resolver
# (which only knows about docker network aliases).
#
# Why the difference matters: in hybrid mode, `akashic` is mapped
# via `extra_hosts: ["akashic:host-gateway"]` in the docker-compose
# override. extra_hosts populates /etc/hosts inside the proxy
# container — but nginx's `resolver 127.0.0.11` (docker's embedded
# DNS) does NOT consult /etc/hosts. Static proxy_pass uses libc
# resolution at boot, picks up the /etc/hosts entry, and routes
# auth.* traffic to the host-gateway IP, which forwards to the
# host akashic on port 8080.
#
# Trade-off: the proxy container will fail to start if `akashic`
# doesn't resolve at boot. In hybrid mode that's fine because
# extra_hosts is unconditional. In container mode you'd want the
# original (variable-based) proxy_pass instead — that's why this
# is a separate file rather than the default config.
#
# Every other server block is identical to nginx.conf — copying
# the whole file (rather than templating just the auth.* part) keeps
# this self-contained and grep-able. If you change a non-auth.*
# block in nginx.conf, mirror the change here.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8280;

    location ~ ^/v1/[^/]+/crl(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location ~ ^/v1/[^/]+/ca(/pem)?$ {
        proxy_pass http://vault:8281;
        proxy_set_header Host $host;
    }

    location / {
        return 403 '{"error": "forbidden"}';
        add_header Content-Type application/json;
    }
}

server {
    listen 8280;
    server_name ~^vault\.;

    location / {
        proxy_pass https://vault:8200;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/vault/root-ca.crt;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

limit_req_zone $binary_remote_addr zone=adminer_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=redisinsight_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=phpldapadmin_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/s;

server {
    listen 8280;
    server_name ~^adminer\.;
    include /etc/nginx/adminer-auth.conf;
    limit_req zone=adminer_limit burst=20 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_adminer http://adminer:8080;
        proxy_pass $upstream_adminer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 8280;
    server_name ~^redisinsight\.;
    include /etc/nginx/redisinsight-auth.conf;
    resolver 127.0.0.11 valid=30s;

    location /assets/ {
        set $upstream_redisinsight_assets http://redisinsight:5540;
        proxy_pass $upstream_redisinsight_assets;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=redisinsight_limit burst=20 nodelay;
        limit_req_status 429;

        set $upstream_redisinsight http://redisinsight:5540;
        proxy_pass $upstream_redisinsight;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 8280;
    server_name ~^grafana\.;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 8280;
    server_name ~^admin\.;
    limit_req zone=admin_limit burst=40 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_admin_bff http://admin-bff:8082;
        proxy_pass $upstream_admin_bff;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# ─────────────────────────────────────────────────────────────
# auth.akashic.* — STATIC proxy_pass (hybrid host-akashic mode)
# ─────────────────────────────────────────────────────────────
# THE difference from nginx.conf: no `set $upstream` indirection.
# nginx resolves "akashic" at config-load via libc, which honors
# /etc/hosts. The host-akashic override populates that /etc/hosts
# entry via extra_hosts (mapping `akashic` to host-gateway).
#
# The proxy container will fail to start if `akashic` doesn't
# resolve at boot. In hybrid mode that's acceptable because the
# extra_hosts entry is unconditional — even if the host akashic
# process is down, the hostname still resolves to the gateway IP,
# nginx starts cleanly, and we just get 502s on auth.* until the
# host akashic comes up. Same graceful degradation as before.
server {
    listen 8280;
    server_name ~^auth\.;
    limit_req zone=auth_limit burst=40 nodelay;
    limit_req_status 429;

    location / {
        # Static — resolved at config-load via libc → /etc/hosts.
        proxy_pass https://akashic:8080;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/akashic/auth-ca.crt;
        # SNI / SAN check uses auth.akashic.local regardless of
        # which IP we connect to — the auth-server cert has
        # auth.akashic.local in its SAN list, not the host gateway IP.
        proxy_ssl_server_name on;
        proxy_ssl_name auth.akashic.local;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 8280;
    server_name ~^phpldapadmin\.;
    include /etc/nginx/phpldapadmin-auth.conf;
    limit_req zone=phpldapadmin_limit burst=20 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_phpldapadmin http://phpldapadmin:80;
        proxy_pass $upstream_phpldapadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
